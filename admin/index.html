<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>GameHub Analytics</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
</head>

<body>

<div class="dashboard">

    <header class="topbar">
        <div>
            <div class="logo">🎮 GAMEHUB</div>
            <div class="subtitle">Analytics Dashboard</div>
        </div>

        <button id="logoutButton">
            Đăng xuất
        </button>
    </header>

    <section id="loginScreen" class="login-card">

        <h1>Admin Login</h1>

        <input
            id="email"
            type="email"
            placeholder="Email"
        >

        <input
            id="password"
            type="password"
            placeholder="Mật khẩu"
        >

        <button id="loginButton">
            Đăng nhập
        </button>

        <p id="loginMessage"></p>

    </section>

    <main id="dashboardContent" hidden>

        <section class="hero">
            <div>
                <span>GAMEHUB</span>
                <h1>Thống kê hệ thống</h1>
                <p>
                    Theo dõi hoạt động của GameHub và từng trò chơi.
                </p>
            </div>
        </section>

        <section class="stats-grid">

            <div class="stat-card">
                <span>Lượt GameHub</span>
                <strong id="totalVisits">0</strong>
            </div>

            <div class="stat-card">
                <span>Lượt chơi</span>
                <strong id="totalGames">0</strong>
            </div>

            <div class="stat-card">
                <span>Ván thắng</span>
                <strong id="totalWins">0</strong>
            </div>

            <div class="stat-card">
                <span>Thời gian chơi</span>
                <strong id="totalTime">0 phút</strong>
            </div>

        </section>

        <section class="panel">

            <div class="panel-header">
                <div>
                    <h2>Game phổ biến</h2>
                    <p>Số lần bắt đầu chơi</p>
                </div>
            </div>

            <div id="gamesList"></div>

        </section>

        <section class="panel">

            <div class="panel-header">
                <div>
                    <h2>Thiết bị</h2>
                    <p>Phân bố người chơi</p>
                </div>
            </div>

            <div id="deviceList"></div>

        </section>

        <section class="panel">

            <div class="panel-header">
                <div>
                    <h2>Hoạt động gần đây</h2>
                    <p>Các sự kiện mới nhất</p>
                </div>
            </div>

            <div id="eventsList"></div>

        </section>

    </main>

</div>

<script src="admin.js"></script>

</body>
</html>
