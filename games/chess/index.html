<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta name="theme-color" content="#111827">

    <title>Cờ vua — GameHub</title>

    <link rel="stylesheet" href="style.css">
</head>

<body data-game="chess">

<main class="page">

    <!-- TOP BAR -->
    <header class="topbar">

        <button id="menuBtn" class="ghost-btn">
            ← GameHub
        </button>

        <div class="brand">
            ♟️ Cờ vua
        </div>

        <button id="newGameTop" class="ghost-btn">
            ↻ Ván mới
        </button>

    </header>


    <!-- =========================
         SETUP
    ========================== -->

    <section class="setup" id="setup">

        <div class="setup-card">

            <h1>♟️ Cờ vua</h1>

            <p class="muted">
                Chơi 2 người, đấu với máy hoặc chơi online.
            </p>


            <!-- MODE -->

            <div class="mode-row">

                <button
                    class="mode-btn active"
                    data-mode="ai"
                    type="button"
                >
                    🤖 Đấu với máy
                </button>

                <button
                    class="mode-btn"
                    data-mode="local"
                    type="button"
                >
                    👥 2 người
                </button>

                <button
                    class="mode-btn"
                    data-mode="online"
                    type="button"
                >
                    🌐 Online
                </button>

            </div>


            <!-- AI DIFFICULTY -->

            <div
                id="difficultyWrap"
                class="field"
            >

                <label for="difficulty">
                    Độ khó
                </label>

                <select id="difficulty">

                    <option value="easy">
                        Dễ
                    </option>

                    <option
                        value="medium"
                        selected
                    >
                        Trung bình
                    </option>

                    <option value="hard">
                        Khó
                    </option>

                </select>

            </div>


            <!-- TIME -->

            <div class="field">

                <label for="timeControl">
                    Thời gian mỗi bên
                </label>

                <select id="timeControl">

                    <option value="0">
                        Không giới hạn
                    </option>

                    <option value="180">
                        3 phút
                    </option>

                    <option
                        value="300"
                        selected
                    >
                        5 phút
                    </option>

                    <option value="600">
                        10 phút
                    </option>

                </select>

            </div>


            <!-- =========================
                 ONLINE PANEL
            ========================== -->

            <div
                id="onlinePanel"
                class="online-panel hidden"
            >

                <div class="online-title">
                    🌐 Chơi online
                </div>


                <!-- CREATE -->

                <button
                    id="createRoomBtn"
                    class="primary-btn"
                    type="button"
                >
                    ➕ Tạo phòng
                </button>


                <div class="online-divider">
                    hoặc
                </div>


                <!-- JOIN -->

                <div class="join-row">

                    <input
                        id="roomInput"
                        class="room-input"
                        type="text"
                        maxlength="6"
                        placeholder="Nhập mã phòng"
                        autocomplete="off"
                    >

                    <button
                        id="joinRoomBtn"
                        class="action-btn"
                        type="button"
                    >
                        Vào phòng
                    </button>

                </div>


                <!-- MESSAGE -->

                <div
                    id="roomMessage"
                    class="room-message"
                    aria-live="polite"
                >
                    Tạo phòng mới hoặc nhập mã phòng.
                </div>


                <!-- CREATED ROOM -->

                <div
                    id="createdRoom"
                    class="created-room hidden"
                >

                    <div class="waiting-icon">
                        ⏳
                    </div>

                    <div
                        id="waitingText"
                        class="waiting-text"
                    >
                        Đang chờ đối thủ...
                    </div>

                    <div
                        id="roomCode"
                        class="room-code"
                    >
                        ------
                    </div>

                    <button
                        id="copyRoomBtn"
                        class="action-btn"
                        type="button"
                    >
                        📋 Copy mã phòng
                    </button>

                    <button
                        id="leaveWaitingBtn"
                        class="action-btn danger"
                        type="button"
                    >
                        Rời phòng
                    </button>

                </div>

            </div>


            <!-- START OFFLINE -->

            <button
                id="startBtn"
                class="primary-btn"
                type="button"
            >
                Bắt đầu
            </button>

        </div>

    </section>


    <!-- =========================
         GAME
    ========================== -->

    <section
        class="game hidden"
        id="game"
    >

        <!-- ONLINE BAR -->

        <div
            id="onlineGameBar"
            class="online-game-bar hidden"
        >

            <span>
                🌐 Phòng:
                <strong id="gameRoomCode">
                    ------
                </strong>
            </span>

            <button
                id="copyGameRoomBtn"
                class="action-btn"
                type="button"
            >
                📋 Copy
            </button>

            <button
                id="leaveOnlineBtn"
                class="action-btn danger"
                type="button"
            >
                Rời phòng
            </button>

        </div>


        <!-- PLAYERS -->

        <div class="game-head">

            <div
                class="player-card"
                id="blackPlayer"
            >

                <span class="dot black-dot"></span>

                <div>

                    <strong id="blackName">
                        Đen
                    </strong>

                    <small id="blackStatus">
                        Chờ lượt
                    </small>

                </div>

                <b id="blackClock">
                    ∞
                </b>

            </div>


            <div
                class="turn-pill"
                id="turnPill"
            >
                Lượt Trắng
            </div>


            <div
                class="player-card"
                id="whitePlayer"
            >

                <span class="dot white-dot"></span>

                <div>

                    <strong id="whiteName">
                        Trắng
                    </strong>

                    <small id="whiteStatus">
                        Đang đi
                    </small>

                </div>

                <b id="whiteClock">
                    ∞
                </b>

            </div>

        </div>


        <!-- BOARD -->

        <div class="board-wrap">

            <div
                class="board"
                id="board"
                aria-label="Bàn cờ vua"
            ></div>

        </div>


        <!-- ACTIONS -->

        <div class="actions">

            <button
                id="undoBtn"
                class="action-btn"
                type="button"
            >
                ↩ Hoàn tác
            </button>

            <button
                id="flipBtn"
                class="action-btn"
                type="button"
            >
                ⇅ Đảo bàn
            </button>

            <button
                id="resignBtn"
                class="action-btn danger"
                type="button"
            >
                🏳 Xin thua
            </button>

        </div>


        <!-- MESSAGE -->

        <div
            class="message"
            id="message"
            aria-live="polite"
        >
            Chọn một quân cờ để đi.
        </div>


        <!-- MOVES -->

        <div class="moves-panel">

            <h3>Nước đi</h3>

            <div
                id="moves"
                class="moves"
            ></div>

        </div>

    </section>

</main>


<!-- =========================
     RESULT
========================== -->

<div
    class="overlay hidden"
    id="resultOverlay"
>

    <div class="result-card">

        <div
            id="resultIcon"
            class="result-icon"
        >
            ♔
        </div>

        <h2 id="resultTitle">
            Kết thúc
        </h2>

        <p id="resultText"></p>

        <div class="result-actions">

            <button
                id="replayBtn"
                class="primary-btn"
                type="button"
            >
                🔄 Chơi lại
            </button>

            <button
                id="backMenuBtn"
                class="action-btn"
                type="button"
            >
                ← Menu
            </button>

        </div>

    </div>

</div>
<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<!-- GAMEHUB -->
<script src="../../js/gamehub.js?v=3"></script>

<!-- CHESS CORE - PHẢI TRƯỚC MAIN -->
<script
    src="./chess.js?v=3"
    onload="console.log('✅ chess.js FILE LOADED')"
    onerror="console.error('❌ KHÔNG TẢI ĐƯỢC chess.js')"
></script>

<!-- SOUND -->
<script src="../../js/sound.js?v=10"></script>

<!-- MAIN -->
<script
    src="./main.js?v=3"
    onload="console.log('✅ main.js FILE LOADED')"
    onerror="console.error('❌ KHÔNG TẢI ĐƯỢC main.js')"
></script>


</body>
</html>
