<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Flappy Bird</title>

    <link rel="stylesheet" href="style.css">
</head>

<body data-game="flappy">

    <main class="game-wrapper">

        <header class="topbar">
            <button id="backButton" class="small-button">
                ← GameHub
            </button>

            <div class="game-title">
                🐦 Flappy Bird
            </div>

            <div class="online-status" id="onlineStatus">
                🟢 Online
            </div>
        </header>

        <section class="game-area">

            <canvas id="gameCanvas"></canvas>

            <div class="hud">
                <div class="score">
                    <span>Score</span>
                    <strong id="score">0</strong>
                </div>

                <div class="high-score">
                    <span>Best</span>
                    <strong id="highScore">0</strong>
                </div>
            </div>

            <div id="startScreen" class="overlay">
                <div class="panel">
                    <div class="bird-icon">🐦</div>

                    <h1>Flappy Bird</h1>

                    <p>Chạm màn hình để bay</p>

                    <button id="startButton" class="main-button">
                        ▶ Chơi
                    </button>

                    <button id="backMenuButton" class="secondary-button">
                        ← Menu
                    </button>
                </div>
            </div>

            <div id="gameOverScreen" class="overlay hidden">
                <div class="panel">

                    <h2>💥 Game Over</h2>

                    <div class="result">
                        <div>
                            <span>Điểm</span>
                            <strong id="finalScore">0</strong>
                        </div>

                        <div>
                            <span>Kỷ lục</span>
                            <strong id="finalHighScore">0</strong>
                        </div>
                    </div>

                    <button id="restartButton" class="main-button">
                        🔄 Chơi lại
                    </button>

                    <button id="gameOverMenuButton" class="secondary-button">
                        ← Menu
                    </button>

                </div>
            </div>

        </section>

        <div class="hint">
            <span>⌨️ Space</span>
            <span>hoặc</span>
            <span>👆 Chạm màn hình</span>
        </div>

    </main>

    <!-- GameHub dùng chung -->
    <script src="../../js/gamehub.js"></script>
    <script src="../../js/sound.js?v=14"></script>

    <!-- Game -->
    <script src="main.js"></script>

</body>
</html>
