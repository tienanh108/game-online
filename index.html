<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caro 5</title>

    <!-- CSS nằm trong thư mục css -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-database-compat.js"></script>
</head>

<body>

    <!-- MENU -->
    <div id="menuScreen" class="screen">
        <div class="menu-card">

            <div class="logo">⭕ ❌</div>

            <h1>CARO 5</h1>
            <p class="subtitle">
                Ai xếp được 5 quân liên tiếp trước sẽ thắng
            </p>

            <div class="section">
                <h3>Chế độ chơi</h3>

                <div class="mode-row">
                    <button id="aiModeBtn" class="mode-btn active">
                        🤖 Chơi với máy
                    </button>

                    <button id="pvpModeBtn" class="mode-btn">
                        👥 Hai người
                    </button>
                </div>
            </div>

            <div class="section">
                <h3>Kích thước bàn cờ</h3>

                <select id="boardSizeSelect">
                    <option value="15">15 × 15</option>
                    <option value="20">20 × 20</option>
                    <option value="25">25 × 25</option>
                </select>
            </div>

            <button id="playButton" class="main-btn">
                ▶ Chơi ngay
            </button>

            <div class="divider">
                <span>HOẶC CHƠI ONLINE</span>
            </div>

            <button id="createRoomButton" class="online-btn">
                ➕ Tạo phòng
            </button>

            <div class="join-row">
                <input
                    id="roomInput"
                    type="text"
                    maxlength="6"
                    placeholder="Mã phòng"
                    autocomplete="off"
                >

                <button id="joinRoomButton">
                    Vào phòng
                </button>
            </div>

            <div id="firebaseStatus" class="firebase-status">
                Đang kết nối...
            </div>

        </div>
    </div>


    <!-- GAME -->
    <div id="gameScreen" class="screen hidden">

        <div class="game-container">

            <div class="game-header">

                <button id="backMenuButton" class="small-btn">
                    ← Menu
                </button>

                <div class="game-title">
                    <strong>CARO 5</strong>
                    <span id="roomInfo"></span>
                </div>

                <button id="newGameButton" class="small-btn">
                    ↻ Ván mới
                </button>

            </div>


            <!-- KẾT QUẢ -->
            <div id="resultBox" class="result-box hidden">
                <div id="resultText"></div>
            </div>


            <!-- THÔNG TIN NGƯỜI CHƠI -->
            <div class="info-panel">

                <div class="player-box x-player">
                    <div class="player-symbol">X</div>

                    <div>
                        <div class="player-name">X</div>

                        <div class="score-label">
                            <span id="scoreX">0</span> điểm
                        </div>
                    </div>
                </div>


                <div class="turn-box">

                    <div id="turnText">
                        Lượt của X
                    </div>

                    <div class="timer-circle">
                        <span id="timer">30</span>
                    </div>

                </div>


                <div class="player-box o-player">

                    <div class="player-symbol">O</div>

                    <div>
                        <div class="player-name">O</div>

                        <div class="score-label">
                            <span id="scoreO">0</span> điểm
                        </div>
                    </div>

                </div>

            </div>


            <!-- BÀN CỜ -->
            <div class="board-scroll">
                <div id="board" class="board"></div>
            </div>


            <!-- NÚT PHÍA DƯỚI -->
            <div class="bottom-buttons">

                <button id="copyRoomButton" class="action-btn hidden">
                    📋 Sao chép mã phòng
                </button>

                <button id="copyLinkButton" class="action-btn hidden">
                    🔗 Sao chép link
                </button>

            </div>

        </div>

    </div>


    <!-- JS nằm trong thư mục js -->
    <script src="js/game.js"></script>
    <script src="js/ai.js"></script>
    <script src="js/firebase.js"></script>
    <script src="js/main.js"></script>

</body>
</html>
