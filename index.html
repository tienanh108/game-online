<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Caro Online</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f3f4f6;
    color: #222;
}

.container {
    width: min(1000px, 100%);
    margin: auto;
    padding: 15px;
}

/* =========================
   MENU
========================= */

#menuScreen {
    display: block;
}

h1 {
    text-align: center;
    margin: 10px 0 20px;
    font-size: 32px;
}

.panel {
    background: white;
    padding: 15px;
    margin-bottom: 15px;
    border-radius: 15px;
    box-shadow: 0 3px 12px rgba(0,0,0,.08);
}

.controls {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

label {
    font-weight: bold;
}

select,
input,
button {
    width: 100%;
    height: 42px;
    margin-top: 5px;
    border-radius: 9px;
    border: 1px solid #ccc;
    padding: 8px;
    font-size: 15px;
}

button {
    background: #222;
    color: white;
    border: none;
    cursor: pointer;
    font-weight: bold;
}

button:hover {
    opacity: .85;
}

button:disabled {
    opacity: .45;
    cursor: not-allowed;
}

.secondary {
    background: #e5e7eb;
    color: #222;
}

.buttons {
    display: flex;
    gap: 8px;
    margin-top: 10px;
}

.online {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

#connectionStatus {
    margin-top: 12px;
    font-size: 13px;
    color: #666;
}

#roomInfo {
    margin-top: 10px;
    font-weight: bold;
}

.room-code {
    font-size: 24px;
    font-weight: bold;
    letter-spacing: 4px;
    margin-top: 8px;
}

.hint {
    color: #777;
    font-size: 13px;
    margin-top: 8px;
}

/* =========================
   GAME SCREEN
========================= */

#gameScreen {
    display: none;
}

.game-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 10px;
}

.game-header button {
    width: auto;
    min-width: 110px;
    padding: 0 15px;
    margin-top: 0;
}

.game-status {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
}

#status {
    font-weight: bold;
    font-size: 18px;
}

.timer {
    min-width: 72px;
    text-align: center;
    font-size: 23px;
    font-weight: bold;
    background: #eee;
    padding: 8px;
    border-radius: 10px;
}

.score {
    display: flex;
    gap: 10px;
    margin-top: 10px;
}

.score span {
    background: #eee;
    padding: 8px 12px;
    border-radius: 8px;
    font-weight: bold;
}

#gameRoomInfo {
    margin-top: 8px;
    color: #777;
    font-size: 13px;
}

/* =========================
   BOARD
========================= */

.board-scroll {
    width: 100%;
    overflow: auto;
    padding: 5px;
    background: #ddd;
    border-radius: 12px;
}

#board {
    --cell-size: 32px;

    display: grid;
    width: max-content;
    margin: auto;

    background: white;
    border: 1px solid #999;

    user-select: none;
    touch-action: manipulation;
}

.cell {
    width: var(--cell-size);
    height: var(--cell-size);

    display: flex;
    align-items: center;
    justify-content: center;

    border-right: 1px solid #ddd;
    border-bottom: 1px solid #ddd;

    font-size: calc(var(--cell-size) * .6);
    font-weight: bold;

    cursor: pointer;
    background: white;
}

.cell.x {
    color: #1264ff;
}

.cell.o {
    color: #e53935;
}

.cell.win {
    background: #ffe082;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    .controls,
    .online {
        grid-template-columns: 1fr;
    }

    .game-header {
        flex-direction: row;
    }

    .game-header button {
        min-width: 0;
        flex: 1;
    }

    .game-status {
        align-items: stretch;
    }

    #status {
        font-size: 16px;
    }

    .timer {
        font-size: 20px;
    }

    .score {
        font-size: 14px;
    }

    h1 {
        font-size: 28px;
    }
}
</style>
</head>

<body>

<div class="container">

    <!-- =================================================
         MENU SCREEN
    ================================================== -->

    <div id="menuScreen">

        <div class="panel">

    <!-- =================================================

    ================================================== -->

    <div id="gameScreen">

        <div class="game-header">

        <!-- STATUS -->
        <div class="panel">

            <div class="game-status">

                </div>

            <div class="score">

        <!-- BOARD -->

</div>


<script type="module">

/* =====================================================
   FIREBASE
===================================================== */

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
    getDatabase,
    ref,
    set,
    get,
    update,
    onValue,
    remove,
    runTransaction,
    onDisconnect
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

import {
    getAuth,
    signInAnonymously,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";


const firebaseConfig = {

    apiKey:
        "AIzaSyA2uJ2-lHYjNeA40kFoS1-VsCaqhjYszdw",

    authDomain:
        "caro-3460d.firebaseapp.com",

    databaseURL:
        "https://caro-3460d-default-rtdb.asia-southeast1.firebasedatabase.app/",

    projectId:
        "caro-3460d",

    storageBucket:
        "caro-3460d.firebasestorage.app",

    messagingSenderId:
        "473059233945",

    appId:
        "1:473059233945:web:7bbf037f41a8a8d331e808",

    measurementId:
        "G-WXXMSSSN3W"

};


/* =====================================================
   DOM
===================================================== */

const boardElement =
    document.getElementById("board");

const statusElement =
    document.getElementById("status");

const timerElement =
    document.getElementById("timer");

const modeElement =
    document.getElementById("mode");

const sizeElement =
    document.getElementById("size");

const xScoreElement =
    document.getElementById("xScore");

const oScoreElement =
    document.getElementById("oScore");

const startButton =
    document.getElementById("startButton");

const newGameButton =
    document.getElementById("newGameButton");

const createRoomButton =
    document.getElementById("createRoomButton");

const joinRoomButton =
    document.getElementById("joinRoomButton");

const roomInput =
    document.getElementById("roomInput");

const roomInfo =
    document.getElementById("roomInfo");

const roomCodeDisplay =
    document.getElementById("roomCodeDisplay");

const connectionStatus =
    document.getElementById("connectionStatus");

const copyRoomButton =
    document.getElementById("copyRoomButton");

const leaveRoomButton =
    document.getElementById("leaveRoomButton");

const menuScreen =
    document.getElementById("menuScreen");

const gameScreen =
    document.getElementById("gameScreen");

const backMenuButton =
    document.getElementById("backMenuButton");

const gameRoomInfo =
    document.getElementById("gameRoomInfo");


/* =====================================================
   GAME
===================================================== */

const WIN_COUNT = 5;

const TURN_TIME = 30;


let SIZE =
    Number(sizeElement.value);

let board = [];

let currentPlayer = "X";

let gameStarted = false;

let gameOver = false;

let timerInterval = null;


/* =====================================================
   ONLINE
===================================================== */

let db = null;

let auth = null;

let currentUser = null;

let firebaseAvailable = false;

let roomCode = null;

let playerRole = null;

let onlineGame = false;

let roomUnsubscribe = null;

let lastProcessedGame = null;


/* =====================================================
   SCORE
===================================================== */

let xScore =
    Number(
        localStorage.getItem(
            "caro_x_score"
        )
    ) || 0;


let oScore =
    Number(
        localStorage.getItem(
            "caro_o_score"
        )
    ) || 0;


/* =====================================================
   AUTH
===================================================== */

let authReadyResolve;

const authReady =
    new Promise(
        resolve => {

            authReadyResolve =
                resolve;

        }
    );


let authResolved = false;


function resolveAuth(user) {

    if (authResolved)
        return;

    authResolved = true;

    authReadyResolve(user);

}


/* =====================================================
   FIREBASE START
===================================================== */

try {

    const app =
        initializeApp(
            firebaseConfig
        );


    db =
        getDatabase(app);


    auth =
        getAuth(app);


    onAuthStateChanged(

        auth,

        user => {

            if (user) {

                currentUser =
                    user;

                firebaseAvailable =
                    true;

                connectionStatus.textContent =
                    "🟢 Đã kết nối Firebase";

                resolveAuth(user);

            }

        },

        error => {

            console.error(
                "Auth:",
                error
            );

            firebaseAvailable =
                false;

            connectionStatus.textContent =
                "🟠 Firebase lỗi — Offline vẫn chơi được";

            resolveAuth(null);

        }

    );


    signInAnonymously(auth)

        .catch(error => {

            console.error(
                "Anonymous login:",
                error
            );

            firebaseAvailable =
                false;

            connectionStatus.textContent =
                "🟠 Không đăng nhập Firebase — Offline";

            resolveAuth(null);

        });


}
catch (error) {

    console.error(
        "Firebase:",
        error
    );

    firebaseAvailable =
        false;

    connectionStatus.textContent =
        "🟠 Firebase chưa hoạt động — Offline";

    resolveAuth(null);

}


/* =====================================================
   SCREEN
===================================================== */

function showGameScreen() {

    menuScreen.style.display =
        "none";

    gameScreen.style.display =
        "block";

    updateCellSize();

}


function showMenuScreen() {

    gameScreen.style.display =
        "none";

    menuScreen.style.display =
        "block";

}


/* =====================================================
   EMPTY BOARD
===================================================== */

function createEmptyBoard(size) {

    return Array.from(

        {
            length: size
        },

        () =>
            Array(size).fill("")

    );

}


/* =====================================================
   CELL SIZE
===================================================== */

function updateCellSize() {

    const scroll =
        document.querySelector(
            ".board-scroll"
        );


    if (!scroll)
        return;


    const width =
        scroll.clientWidth - 10;


    let cellSize =
        Math.floor(
            width / SIZE
        );


    cellSize =
        Math.min(
            cellSize,
            40
        );


    cellSize =
        Math.max(
            cellSize,
            24
        );


    boardElement.style.setProperty(
        "--cell-size",
        cellSize + "px"
    );

}


/* =====================================================
   CREATE BOARD
===================================================== */

function createBoard() {

    SIZE =
        Number(
            sizeElement.value
        );


    board =
        createEmptyBoard(
            SIZE
        );


    boardElement.innerHTML =
        "";


    boardElement.style.gridTemplateColumns =
        `repeat(${SIZE}, var(--cell-size))`;


    boardElement.style.gridTemplateRows =
        `repeat(${SIZE}, var(--cell-size))`;


    for (
        let row = 0;
        row < SIZE;
        row++
    ) {

        for (
            let col = 0;
            col < SIZE;
            col++
        ) {

            const cell =
                document.createElement(
                    "div"
                );


            cell.className =
                "cell";


            cell.dataset.row =
                row;


            cell.dataset.col =
                col;


            cell.addEventListener(
                "click",
                handleClick
            );


            boardElement.appendChild(
                cell
            );

        }

    }


    updateCellSize();

}


/* =====================================================
   RENDER
===================================================== */

function renderBoard() {

    const cells =
        boardElement.querySelectorAll(
            ".cell"
        );


    for (
        let row = 0;
        row < SIZE;
        row++
    ) {

        for (
            let col = 0;
            col < SIZE;
            col++
        ) {

            const index =
                row * SIZE + col;


            const cell =
                cells[index];


            if (!cell)
                continue;


            const value =
                board[row]?.[col] || "";


            cell.textContent =
                value;


            cell.classList.remove(
                "x",
                "o",
                "win"
            );


            if (
                value === "X"
            ) {

                cell.classList.add(
                    "x"
                );

            }


            if (
                value === "O"
            ) {

                cell.classList.add(
                    "o"
                );

            }

        }

    }

}


/* =====================================================
   CLICK
===================================================== */

function handleClick(event) {

    if (
        !gameStarted ||
        gameOver
    )
        return;


    const row =
        Number(
            event.currentTarget.dataset.row
        );


    const col =
        Number(
            event.currentTarget.dataset.col
        );


    if (
        board[row]?.[col] !== ""
    )
        return;


    if (onlineGame) {

        if (
            currentPlayer !==
            playerRole
        )
            return;


        makeOnlineMove(
            row,
            col
        );

        return;

    }


    if (
        modeElement.value === "ai" &&
        currentPlayer === "O"
    )
        return;


    makeMove(
        row,
        col
    );


    if (
        !gameOver &&
        modeElement.value === "ai" &&
        currentPlayer === "O"
    ) {

        setTimeout(
            aiMove,
            300
        );

    }

}


/* =====================================================
   OFFLINE MOVE
===================================================== */

function makeMove(
    row,
    col
) {

    board[row][col] =
        currentPlayer;


    renderBoard();


    const winningCells =
        checkWin(
            row,
            col
        );


    if (
        winningCells.length >=
        WIN_COUNT
    ) {

        endGame(
            winningCells
        );

        return;

    }


    if (
        isDraw()
    ) {

        gameOver =
            true;


        stopTimer();


        statusElement.textContent =
            "🤝 HÒA!";


        return;

    }


    currentPlayer =
        currentPlayer === "X"
            ? "O"
            : "X";


    statusElement.textContent =
        `Lượt của ${currentPlayer}`;


    resetTimer();

}


/* =====================================================
   WIN CHECK
===================================================== */

function checkWin(
    row,
    col
) {

    return checkWinOnBoard(
        board,
        SIZE,
        row,
        col
    );

}


function checkWinOnBoard(
    gameBoard,
    size,
    row,
    col
) {

    const player =
        gameBoard[row]?.[col];


    if (!player)
        return [];


    const directions = [

        [0, 1],

        [1, 0],

        [1, 1],

        [1, -1]

    ];


    for (
        const [dr, dc]
        of directions
    ) {

        const cells = [
            [row, col]
        ];


        let r =
            row + dr;

        let c =
            col + dc;


        while (

            r >= 0 &&
            r < size &&
            c >= 0 &&
            c < size &&
            gameBoard[r]?.[c] === player

        ) {

            cells.push([
                r,
                c
            ]);


            r += dr;

            c += dc;

        }


        r =
            row - dr;

        c =
            col - dc;


        while (

            r >= 0 &&
            r < size &&
            c >= 0 &&
            c < size &&
            gameBoard[r]?.[c] === player

        ) {

            cells.push([
                r,
                c
            ]);


            r -= dr;

            c -= dc;

        }


        if (
            cells.length >=
            WIN_COUNT
        ) {

            return cells;

        }

    }


    return [];

}


/* =====================================================
   DRAW
===================================================== */

function isDraw() {

    return isDrawOnBoard(
        board,
        SIZE
    );

}


function isDrawOnBoard(
    gameBoard,
    size
) {

    for (
        let row = 0;
        row < size;
        row++
    ) {

        for (
            let col = 0;
            col < size;
            col++
        ) {

            if (
                gameBoard[row]?.[col] === ""
            )
                return false;

        }

    }


    return true;

}


/* =====================================================
   END GAME
===================================================== */

function endGame(
    winningCells
) {

    gameOver =
        true;


    stopTimer();


    if (
        currentPlayer === "X"
    ) {

        xScore++;

        localStorage.setItem(
            "caro_x_score",
            xScore
        );

    }
    else {

        oScore++;

        localStorage.setItem(
            "caro_o_score",
            oScore
        );

    }


    updateScore();


    statusElement.textContent =
        `🎉 ${currentPlayer} THẮNG!`;


    highlightWin(
        winningCells
    );

}


/* =====================================================
   HIGHLIGHT WIN
===================================================== */

function highlightWin(
    cells
) {

    const allCells =
        boardElement.querySelectorAll(
            ".cell"
        );


    for (
        const [row, col]
        of cells
    ) {

        const index =
            row * SIZE + col;


        if (
            allCells[index]
        ) {

            allCells[index]
                .classList
                .add("win");

        }

    }

}


/* =====================================================
   TIMER
===================================================== */

function resetTimer(
    startTime = Date.now()
) {

    stopTimer();


    timerElement.textContent =
        TURN_TIME;


    if (
        !gameStarted ||
        gameOver
    )
        return;


    timerInterval =
        setInterval(

            () => {

                updateTimer(
                    startTime
                );

            },

            250

        );


    updateTimer(
        startTime
    );

}


function updateTimer(
    startTime
) {

    if (
        !gameStarted ||
        gameOver
    ) {

        stopTimer();

        return;

    }


    const elapsed =
        Math.floor(

            (
                Date.now() -
                startTime
            ) / 1000

        );


    const remaining =
        Math.max(

            0,

            TURN_TIME -
            elapsed

        );


    timerElement.textContent =
        remaining;


    if (
        remaining <= 0
    ) {

        stopTimer();


        if (onlineGame) {

            handleOnlineTimeout(
                startTime
            );

        }
        else {

            currentPlayer =
                currentPlayer === "X"
                    ? "O"
                    : "X";


            statusElement.textContent =
                `⏰ Hết giờ! Lượt của ${currentPlayer}`;


            resetTimer();

            if (
                !gameOver &&
                modeElement.value === "ai" &&
                currentPlayer === "O"
            ) {

                setTimeout(
                    aiMove,
                    300
                );

            }

        }

    }

}


function stopTimer() {

    if (
        timerInterval !== null
    ) {

        clearInterval(
            timerInterval
        );

        timerInterval =
            null;

    }

}


/* =====================================================
   START GAME
===================================================== */

function startGame() {

    if (
        gameStarted ||
        onlineGame
    )
        return;


    gameStarted =
        true;


    gameOver =
        false;


    currentPlayer =
        "X";


    startButton.disabled =
        true;


    startButton.textContent =
        "▶️ Đang chơi";


    statusElement.textContent =
        "Lượt của X";


    showGameScreen();


    resetTimer();

}


/* =====================================================
   NEW GAME
===================================================== */

async function newGame() {

    stopTimer();


    if (
        onlineGame &&
        roomCode
    ) {

        if (
            playerRole !== "X"
        ) {

            statusElement.textContent =
                "Chỉ X có thể bắt đầu ván mới.";

            return;

        }


        try {

            await authReady;


            if (!currentUser)
                return;


            const roomRef =
                ref(
                    db,
                    `rooms/${roomCode}`
                );


            const snapshot =
                await get(
                    roomRef
                );


            if (
                !snapshot.exists()
            )
                return;


            const room =
                snapshot.val();


            if (
                !room.playerO
            ) {

                statusElement.textContent =
                    "Đang chờ người chơi O...";

                return;

            }


            lastProcessedGame =
                null;


            await update(

                roomRef,

                {

                    board:
                        createEmptyBoard(
                            Number(room.size)
                        ),

                    currentPlayer:
                        "X",

                    gameOver:
                        false,

                    gameStarted:
                        true,

                    winner:
                        null,

                    turnStartedAt:
                        Date.now(),

                    lastMove:
                        null,

                    updatedAt:
                        Date.now()

                }

            );

        }
        catch (error) {

            console.error(
                error
            );

            alert(
                error.message
            );

        }


        return;

    }


    gameStarted =
        false;


    gameOver =
        false;


    currentPlayer =
        "X";


    timerElement.textContent =
        TURN_TIME;


    startButton.disabled =
        false;


    startButton.textContent =
        "▶️ Bắt đầu";


    statusElement.textContent =
        'Nhấn "Bắt đầu" để chơi';


    createBoard();

}


/* =====================================================
   ROOM CODE
===================================================== */

function generateRoomCode() {

    const chars =
        "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";


    let code = "";


    for (
        let i = 0;
        i < 6;
        i++
    ) {

        code +=
            chars[
                Math.floor(
                    Math.random() *
                    chars.length
                )
            ];

    }


    return code;

}


/* =====================================================
   CREATE ROOM
===================================================== */

async function createRoom() {

    if (roomCode) {

        alert(
            "Bạn đang ở trong một phòng."
        );

        return;

    }


    try {

        await authReady;


        if (
            !firebaseAvailable ||
            !currentUser
        ) {

            alert(
                "Firebase chưa đăng nhập.\n\n" +
                "Hãy kiểm tra Anonymous Authentication."
            );

            return;

        }


        const size =
            Number(
                sizeElement.value
            );


        let code =
            generateRoomCode();


        let roomRef =
            ref(
                db,
                `rooms/${code}`
            );


        let snapshot =
            await get(
                roomRef
            );


        while (
            snapshot.exists()
        ) {

            code =
                generateRoomCode();


            roomRef =
                ref(
                    db,
                    `rooms/${code}`
                );


            snapshot =
                await get(
                    roomRef
                );

        }


        await set(

            roomRef,

            {

                board:
                    createEmptyBoard(
                        size
                    ),

                size:
                    size,

                currentPlayer:
                    "X",

                gameOver:
                    false,

                gameStarted:
                    false,

                winner:
                    null,

                playerX:
                    currentUser.uid,

                playerO:
                    null,

                turnStartedAt:
                    null,

                createdAt:
                    Date.now(),

                updatedAt:
                    Date.now()

            }

        );


        roomCode =
            code;


        playerRole =
            "X";


        onlineGame =
            true;


        showRoomUI();


        setupRoomListener();


        statusElement.textContent =
            "⏳ Đang chờ người chơi O...";


        connectionStatus.textContent =
            "🟢 Đã tạo phòng";


        await onDisconnect(
            roomRef
        ).remove();

    }
    catch (error) {

        console.error(
            "CREATE:",
            error
        );


        alert(
            "Không tạo được phòng.\n\n" +
            error.message
        );

    }

}


/* =====================================================
   JOIN ROOM
===================================================== */

async function joinRoom() {

    if (roomCode) {

        alert(
            "Bạn đang ở trong một phòng."
        );

        return;

    }


    try {

        await authReady;


        if (
            !firebaseAvailable ||
            !currentUser
        ) {

            alert(
                "Firebase chưa đăng nhập."
            );

            return;

        }


        const code =
            roomInput.value
                .trim()
                .toUpperCase();


        if (
            code.length !== 6
        ) {

            alert(
                "Mã phòng phải có 6 ký tự."
            );

            return;

        }


        const roomRef =
            ref(
                db,
                `rooms/${code}`
            );


        const snapshot =
            await get(
                roomRef
            );


        if (
            !snapshot.exists()
        ) {

            alert(
                "Không tìm thấy phòng."
            );

            return;

        }


        const room =
            snapshot.val();


        if (
            room.playerO
        ) {

            alert(
                "Phòng đã đủ 2 người."
            );

            return;

        }


        if (
            room.playerX ===
            currentUser.uid
        ) {

            alert(
                "Bạn không thể tự vào phòng của mình."
            );

            return;

        }


        const result =
            await runTransaction(

                roomRef,

                currentRoom => {

                    if (
                        !currentRoom
                    )
                        return;


                    if (
                        currentRoom.playerO
                    )
                        return;


                    currentRoom.playerO =
                        currentUser.uid;


                    currentRoom.gameStarted =
                        true;


                    currentRoom.currentPlayer =
                        "X";


                    currentRoom.gameOver =
                        false;


                    currentRoom.winner =
                        null;


                    currentRoom.turnStartedAt =
                        Date.now();


                    currentRoom.updatedAt =
                        Date.now();


                    return currentRoom;

                }

            );


        if (
            !result.committed
        ) {

            alert(
                "Phòng vừa có người khác vào."
            );

            return;

        }


        roomCode =
            code;


        playerRole =
            "O";


        onlineGame =
            true;


        showRoomUI();


        setupRoomListener();


        connectionStatus.textContent =
            "🟢 Đã vào phòng";

    }
    catch (error) {

        console.error(
            "JOIN:",
            error
        );


        alert(
            "Không thể vào phòng.\n\n" +
            error.message
        );

    }

}


/* =====================================================
   ROOM LISTENER
===================================================== */

function setupRoomListener() {

    if (
        roomUnsubscribe
    ) {

        roomUnsubscribe();

        roomUnsubscribe =
            null;

    }


    const roomRef =
        ref(
            db,
            `rooms/${roomCode}`
        );


    roomUnsubscribe =
        onValue(

            roomRef,

            snapshot => {

                if (
                    !snapshot.exists()
                ) {

                    alert(
                        "Phòng đã bị đóng."
                    );


                    resetOnlineState();


                    return;

                }


                const room =
                    snapshot.val();


                const roomSize =
                    Number(
                        room.size
                    );


                if (
                    SIZE !== roomSize
                ) {

                    SIZE =
                        roomSize;


                    sizeElement.value =
                        roomSize;


                    createBoard();

                }


                board =
                    room.board ||
                    createEmptyBoard(
                        SIZE
                    );


                renderBoard();


                currentPlayer =
                    room.currentPlayer ||
                    "X";


                gameOver =
                    !!room.gameOver;


                gameStarted =
                    !!room.gameStarted;


                const playersReady =
                    !!room.playerX &&
                    !!room.playerO;


                if (
                    !playersReady
                ) {

                    stopTimer();


                    timerElement.textContent =
                        "—";


                    statusElement.textContent =
                        "⏳ Đang chờ người chơi O...";


                    return;

                }


                if (
                    room.gameOver
                ) {

                    processOnlineResult(
                        room
                    );

                    return;

                }


                if (
                    gameStarted
                ) {

                    if (
                        currentPlayer ===
                        playerRole
                    ) {

                        statusElement.textContent =
                            `🎯 Lượt của bạn (${playerRole})`;

                    }
                    else {

                        statusElement.textContent =
                            `⏳ Lượt đối thủ (${currentPlayer})`;

                    }


                    if (
                        room.turnStartedAt
                    ) {

                        resetTimer(
                            Number(
                                room.turnStartedAt
                            )
                        );

                    }

                }

            },

            error => {

                console.error(
                    "ROOM:",
                    error
                );


                connectionStatus.textContent =
                    "🔴 Lỗi Firebase";

            }

        );

}


/* =====================================================
   ONLINE MOVE
===================================================== */

async function makeOnlineMove(
    row,
    col
) {

    try {

        await authReady;


        if (
            !currentUser ||
            !roomCode ||
            !playerRole
        )
            return;


        const roomRef =
            ref(
                db,
                `rooms/${roomCode}`
            );


        const result =
            await runTransaction(

                roomRef,

                room => {

                    if (
                        !room ||
                        room.gameOver ||
                        !room.gameStarted
                    )
                        return;


                    if (
                        room.currentPlayer !==
                        playerRole
                    )
                        return;


                    if (
                        playerRole === "X" &&
                        room.playerX !==
                        currentUser.uid
                    )
                        return;


                    if (
                        playerRole === "O" &&
                        room.playerO !==
                        currentUser.uid
                    )
                        return;


                    const size =
                        Number(
                            room.size
                        );


                    const oldBoard =
                        room.board ||
                        createEmptyBoard(
                            size
                        );


                    if (
                        !oldBoard[row] ||
                        oldBoard[row][col] !== ""
                    )
                        return;


                    const newBoard =
                        oldBoard.map(
                            r => [...r]
                        );


                    newBoard[row][col] =
                        playerRole;


                    const winningCells =
                        checkWinOnBoard(
                            newBoard,
                            size,
                            row,
                            col
                        );


                    const won =
                        winningCells.length >=
                        WIN_COUNT;


                    const draw =
                        !won &&
                        isDrawOnBoard(
                            newBoard,
                            size
                        );


                    return {

                        ...room,

                        board:
                            newBoard,

                        currentPlayer:
                            won || draw
                                ? playerRole
                                : (
                                    playerRole === "X"
                                        ? "O"
                                        : "X"
                                ),

                        gameOver:
                            won || draw,

                        winner:
                            won
                                ? playerRole
                                : null,

                        turnStartedAt:
                            won || draw
                                ? null
                                : Date.now(),

                        lastMove:
                            `${row},${col}`,

                        updatedAt:
                            Date.now()

                    };

                }

            );


        if (
            !result.committed
        )
            return;

    }
    catch (error) {

        console.error(
            "MOVE:",
            error
        );


        alert(
            "Không thể gửi nước đi.\n\n" +
            error.message
        );

    }

}


/* =====================================================
   ONLINE TIMEOUT
===================================================== */

async function handleOnlineTimeout(
    startTime
) {

    try {

        await authReady;


        if (!currentUser)
            return;


        const roomRef =
            ref(
                db,
                `rooms/${roomCode}`
            );


        await runTransaction(

            roomRef,

            room => {

                if (
                    !room ||
                    room.gameOver ||
                    !room.gameStarted
                )
                    return;


                if (
                    Number(
                        room.turnStartedAt
                    ) !==
                    Number(startTime)
                )
                    return;


                if (
                    Date.now() -
                    Number(
                        room.turnStartedAt
                    ) <
                    TURN_TIME * 1000
                )
                    return;


                const nextPlayer =
                    room.currentPlayer === "X"
                        ? "O"
                        : "X";


                return {

                    ...room,

                    currentPlayer:
                        nextPlayer,

                    turnStartedAt:
                        Date.now(),

                    updatedAt:
                        Date.now()

                };

            }

        );

    }
    catch (error) {

        console.error(
            "TIMEOUT:",
            error
        );

    }

}


/* =====================================================
   ONLINE RESULT
===================================================== */

function processOnlineResult(
    room
) {

    stopTimer();


    if (
        room.winner
    ) {

        const winner =
            room.winner;


        const gameId =
            `${room.updatedAt}-${winner}`;


        if (
            lastProcessedGame !==
            gameId
        ) {

            lastProcessedGame =
                gameId;


            if (
                winner === "X"
            ) {

                xScore++;

                localStorage.setItem(
                    "caro_x_score",
                    xScore
                );

            }
            else {

                oScore++;

                localStorage.setItem(
                    "caro_o_score",
                    oScore
                );

            }


            updateScore();

        }


        const cells =
            findWinningCells(
                winner
            );


        if (
            cells.length >=
            WIN_COUNT
        ) {

            highlightWin(
                cells
            );

        }


        statusElement.textContent =
            winner === playerRole
                ? `🎉 Bạn (${winner}) THẮNG!`
                : `😢 ${winner} THẮNG!`;

    }
    else {

        statusElement.textContent =
            "🤝 HÒA!";

    }

}


/* =====================================================
   FIND ONLINE WIN
===================================================== */

function findWinningCells(
    player
) {

    for (
        let row = 0;
        row < SIZE;
        row++
    ) {

        for (
            let col = 0;
            col < SIZE;
            col++
        ) {

            if (
                board[row]?.[col] !==
                player
            )
                continue;


            const cells =
                checkWinOnBoard(
                    board,
                    SIZE,
                    row,
                    col
                );


            if (
                cells.length >=
                WIN_COUNT
            )
                return cells;

        }

    }


    return [];

}

   ROOM UI

/* =====================================================
   COPY ROOM LINK
===================================================== */

async function copyRoomLink() {

        return;


    const url =
        new URL(

/* =====================================================
   LEAVE ROOM
===================================================== */

async function leaveRoom() {

    if (!roomCode)
        return;


    const code =
        roomCode;


    try {

        await authReady;


        if (
            playerRole === "X"
        ) {

            await remove(
                ref(
                    db,
                    `rooms/${code}`
                )
            );

        }
        else {

            await update(

                ref(
                    db,
                    `rooms/${code}`
                ),

                {

                    playerO:
                        null,

                    gameStarted:
                        false,

                    gameOver:
                        false,

                    winner:
                        null,

                    turnStartedAt:
                        null,

                    updatedAt:
                        Date.now()

                }

            );

        }

    }
    catch (error) {

        console.error(
            "LEAVE:",
            error
        );

    }


    resetOnlineState();

}

   RESET ONLINE
===================================================== */

function resetOnlineState() {

    if (

        roomUnsubscribe();

/* =====================================================

/* =====================================================
   AI
===================================================== */

function aiMove() {

    if (
        !gameStarted ||
        gameOver ||
        onlineGame ||
        currentPlayer !== "O"
    )
        return;


    let move =
        findWinningMove(
            "O"
        );


    if (!move) {

        move =
            findWinningMove(
                "X"
            );

    }


    if (!move) {

        move =
            findBestMove();

    }


    if (move) {

        makeMove(
            move.row,
            move.col
        );

    }

}


/* =====================================================
   AI WINNING MOVE
===================================================== */

function findWinningMove(
    player
) {

    for (
        let row = 0;
        row < SIZE;
        row++
    ) {

        for (
            let col = 0;
            col < SIZE;
            col++
        ) {

            if (
                board[row][col] !== ""
            )
                continue;


            board[row][col] =
                player;


            const win =
                checkWin(
                    row,
                    col
                ).length >=
                WIN_COUNT;


            board[row][col] =
                "";


            if (win) {

                return {
                    row,
                    col
                };

            }

        }

    }


    return null;

}


/* =====================================================
   AI BEST MOVE
===================================================== */

function findBestMove() {

    let bestMove =
        null;


    let bestScore =
        -Infinity;


    let hasMove =
        false;


    for (
        let row = 0;
        row < SIZE;
        row++
    ) {

        for (
            let col = 0;
            col < SIZE;
            col++
        ) {

            if (
                board[row][col] !== ""
            )
                continue;


            hasMove =
                true;


            const score =
                evaluatePosition(
                    row,
                    col
                );


            if (
                score >
                bestScore
            ) {

                bestScore =
                    score;


                bestMove = {
                    row,
                    col
                };

            }

        }

    }


    if (!hasMove)
        return null;


    return bestMove;

}


/* =====================================================
   AI EVALUATION
===================================================== */

function evaluatePosition(
    row,
    col
) {

    let score =
        0;


    const center =
        (SIZE - 1) / 2;


    const distance =
        Math.abs(
            row - center
        ) +
        Math.abs(
            col - center
        );


    score +=
        100 -
        distance * 3;


    for (
        let dr = -2;
        dr <= 2;
        dr++
    ) {

        for (
            let dc = -2;
            dc <= 2;
            dc++
        ) {

            if (
                dr === 0 &&
                dc === 0
            )
                continue;


            const r =
                row + dr;


            const c =
                col + dc;


            if (
                r < 0 ||
                r >= SIZE ||
                c < 0 ||
                c >= SIZE
            )
                continue;


            if (
                board[r][c] === "O"
            ) {

                score +=
                    25;

            }


            if (
                board[r][c] === "X"
            ) {

                score +=
                    20;

            }

        }

    }


    return score;

}

   SCORE
===================================================== */

    oScoreElement.textContent =
