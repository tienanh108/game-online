<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Caro</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #222;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 15px;
}

.container {
    width: 100%;
    max-width: 1100px;
}

.card {
    background: rgba(255,255,255,0.96);
    border-radius: 22px;
    padding: 25px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.25);
}

/* ================= MENU ================= */

#menuScreen {
    text-align: center;
}

.logo {
    font-size: 52px;
    margin-bottom: 5px;
}

h1 {
    margin: 0;
    font-size: 42px;
}

.subtitle {
    color: #777;
    margin: 8px 0 25px;
}

.section {
    margin: 18px 0;
}

label {
    display: block;
    text-align: left;
    font-weight: bold;
    margin-bottom: 7px;
}

select,
input {
    width: 100%;
    padding: 13px 15px;
    border-radius: 12px;
    border: 2px solid #ddd;
    font-size: 16px;
    outline: none;
    background: white;
}

select:focus,
input:focus {
    border-color: #667eea;
}

button {
    border: none;
    border-radius: 12px;
    padding: 13px 18px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.15s;
}

button:active {
    transform: scale(0.96);
}

.primary {
    background: #667eea;
    color: white;
}

.primary:hover {
    background: #5568d8;
}

.secondary {
    background: #eee;
    color: #333;
}

.secondary:hover {
    background: #ddd;
}

.danger {
    background: #e74c3c;
    color: white;
}

.onlineBox {
    margin-top: 25px;
    padding: 18px;
    background: #f5f6ff;
    border-radius: 15px;
}

.onlineTitle {
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 15px;
}

.row {
    display: flex;
    gap: 10px;
}

.row > * {
    flex: 1;
}

.status {
    margin-top: 12px;
    font-size: 14px;
    color: #777;
}

.status.connected {
    color: #18a558;
}

.status.error {
    color: #e74c3c;
}

/* ================= GAME ================= */

#gameScreen {
    display: none;
}

.gameTop {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 15px;
    flex-wrap: wrap;
}

.gameButtons {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}

.gameInfo {
    text-align: center;
    flex: 1;
    min-width: 200px;
}

.statusText {
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 5px;
}

.timer {
    font-size: 30px;
    font-weight: bold;
}

.timer.warning {
    color: #e74c3c;
}

.scoreBoard {
    display: flex;
    justify-content: center;
    gap: 35px;
    margin: 12px 0 18px;
    font-size: 18px;
}

.scoreX {
    font-weight: bold;
}

.scoreO {
    font-weight: bold;
}

.roomInfo {
    background: #f5f5f5;
    padding: 12px;
    border-radius: 12px;
    text-align: center;
    margin-bottom: 15px;
}

.roomCodeDisplay {
    font-size: 20px;
    font-weight: bold;
    letter-spacing: 3px;
}

.roomActions {
    margin-top: 8px;
    display: flex;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
}

/* ================= BOARD ================= */

.boardWrapper {
    width: 100%;
    overflow: auto;
    display: flex;
    justify-content: center;
    padding: 5px;
}

.board {
    display: grid;
    background: #d8a45c;
    border: 3px solid #8b5a2b;
    box-shadow: 0 8px 25px rgba(0,0,0,0.18);
    flex-shrink: 0;
}

.cell {
    background:
        linear-gradient(to right, transparent calc(50% - 0.5px), #555 calc(50% - 0.5px), #555 calc(50% + 0.5px), transparent calc(50% + 0.5px)),
        linear-gradient(to bottom, transparent calc(50% - 0.5px), #555 calc(50% - 0.5px), #555 calc(50% + 0.5px), transparent calc(50% + 0.5px));
    position: relative;
    cursor: pointer;
}

.cell:hover {
    background-color: rgba(255,255,255,0.18);
}

.cell.x::after {
    content: "×";
    position: absolute;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #d63031;
    font-weight: bold;
}

.cell.o::after {
    content: "○";
    position: absolute;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #0984e3;
    font-weight: bold;
}

.cell.lastMove {
    background-color: rgba(255,255,0,0.25);
}

@media (max-width: 600px) {
    body {
        padding: 8px;
        align-items: flex-start;
        padding-top: 10px;
    }

    .card {
        padding: 15px;
        border-radius: 17px;
    }

    h1 {
        font-size: 34px;
    }

    .logo {
        font-size: 42px;
    }

    .gameTop {
        flex-direction: column;
    }

    .gameInfo {
        order: -1;
    }

    .gameButtons {
        width: 100%;
    }

    .gameButtons button {
        flex: 1;
    }

    .scoreBoard {
        gap: 20px;
    }
}
</style>
</head>

<body>

<div class="container">

    <!-- ================= MENU ================= -->

    <div id="menuScreen" class="card">

        <div class="logo">♟</div>
        <h1>Caro</h1>

        <div class="subtitle">
            Game Caro 5 ô liên tiếp
        </div>

        <div class="section">

            </div>

            </button>

                    id="roomInput"
                    maxlength="6"

                >

            </div>

    <!-- ================= GAME ================= -->

    <div id="gameScreen" class="card">

        <div class="gameTop">

            <div class="gameButtons">
                <button id="backMenuButton" class="secondary">

                </button>

                <button id="newGameButton" class="primary">

                </button>
            </div>

            <div class="gameInfo">

                <div id="statusText" class="statusText">

                </div>

                </div>

            </div>

        </div>


        <div class="scoreBoard">

            <div class="scoreX">

            </div>

            <div class="scoreO">
                🔵 O: <span id="scoreO">0</span>
            </div>

        </div>


        <div id="roomInfo" class="roomInfo" style="display:none;">

            <div>
                Phòng:
                <span id="roomCodeDisplay" class="roomCodeDisplay"></span>
            </div>

            <div id="myRoleDisplay" style="margin-top:5px;">
            </div>

            <div class="roomActions">

                <button id="copyRoomButton" class="secondary">

                </button>

                <button id="copyLinkButton" class="secondary">
                    🔗 Sao chép link
                </button>

                    Rời phòng
                </button>

            </div>

        </div>


        <div class="boardWrapper">
            <div id="board" class="board"></div>
        </div>

    </div>

</div>


<script type="module">

/* =========================================================
   FIREBASE
========================================================= */

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
    getDatabase,
    ref,
    set,
    get,
    update,
    onValue,
    remove,
    runTransaction,
    onDisconnect,
    push
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

import {
    getAuth,
    signInAnonymously,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";


const firebaseConfig = {
    apiKey: "AIzaSyA2uJ2-lHYjNeA40kFoS1-VsCaqhjYszdw",
    authDomain: "caro-3460d.firebaseapp.com",
    databaseURL: "https://caro-3460d-default-rtdb.asia-southeast1.firebasedatabase.app/",
    projectId: "caro-3460d",
    storageBucket: "caro-3460d.firebasestorage.app",
    messagingSenderId: "473059233945",
    appId: "1:473059233945:web:7bbf037f41a8a8d331e808",
    measurementId: "G-WXXMSSSN3W"
};


const app = initializeApp(firebaseConfig);

const db = getDatabase(app);

const auth = getAuth(app);


/* =========================================================
   DOM
========================================================= */

const menuScreen = document.getElementById("menuScreen");
const gameScreen = document.getElementById("gameScreen");

const modeSelect = document.getElementById("modeSelect");
const sizeSelect = document.getElementById("sizeSelect");

const startButton = document.getElementById("startButton");
const createRoomButton = document.getElementById("createRoomButton");
const joinRoomButton = document.getElementById("joinRoomButton");

const roomInput = document.getElementById("roomInput");

const connectionStatus = document.getElementById("connectionStatus");

const backMenuButton = document.getElementById("backMenuButton");
const newGameButton = document.getElementById("newGameButton");

const leaveRoomButton = document.getElementById("leaveRoomButton");
const copyRoomButton = document.getElementById("copyRoomButton");
const copyLinkButton = document.getElementById("copyLinkButton");

const boardElement = document.getElementById("board");

const statusText = document.getElementById("statusText");
const timerElement = document.getElementById("timer");

const scoreXElement = document.getElementById("scoreX");
const scoreOElement = document.getElementById("scoreO");

const roomInfo = document.getElementById("roomInfo");
const roomCodeDisplay = document.getElementById("roomCodeDisplay");
const myRoleDisplay = document.getElementById("myRoleDisplay");


/* =========================================================
   GAME STATE
========================================================= */

let board = [];
let boardSize = 15;

let currentPlayer = "X";

let gameOver = false;

let gameMode = "pvp";

let timer = 30;
let timerInterval = null;

let scoreX = 0;
let scoreO = 0;

let lastMove = null;


/* =========================================================
   ONLINE STATE
========================================================= */

let isOnlineGame = false;

let roomCode = null;

let myRole = null;

let currentUser = null;

let roomUnsubscribe = null;

/*
    Đây là điểm quan trọng của bản sửa.

    Mỗi thiết bị / tab có một connection riêng:

    rooms/CODE/connections/XXXX

    Khi thiết bị mất mạng / đóng trang,
    Firebase tự động xóa connection đó.
*/
let presenceRef = null;


/* =========================================================
   AUTH
========================================================= */

onAuthStateChanged(auth, user => {

    if (user) {

        currentUser = user;

        connectionStatus.textContent =
            "🟢 Đã kết nối Firebase";

        connectionStatus.className =
            "status connected";

    } else {

        currentUser = null;

        connectionStatus.textContent =
            "🔴 Chưa đăng nhập Firebase";

        connectionStatus.className =
            "status error";
    }

});


signInAnonymously(auth).catch(error => {

    console.error("Firebase Auth error:", error);

    connectionStatus.textContent =
        "🔴 Không thể kết nối Firebase";

    connectionStatus.className =
        "status error";

});


/* =========================================================
   WAIT FOR AUTH
========================================================= */

async function waitForAuth() {

    if (currentUser) {
        return currentUser;
    }

    return new Promise((resolve, reject) => {

        const timeout = setTimeout(() => {

            unsubscribe();

            reject(
                new Error("Firebase Auth timeout")
            );

        }, 10000);


        const unsubscribe =
            onAuthStateChanged(auth, user => {

                if (user) {

                    clearTimeout(timeout);

                    unsubscribe();

                    currentUser = user;

                    resolve(user);
                }

            });

    });

}


/* =========================================================
   CREATE BOARD
========================================================= */

function createEmptyBoard(size) {

    return Array.from(
        { length: size },
        () => Array(size).fill("")
    );

}


/* =========================================================
   START OFFLINE GAME
========================================================= */

function startOfflineGame() {

    gameMode = modeSelect.value;

    boardSize = Number(sizeSelect.value);

    isOnlineGame = false;

    roomCode = null;

    myRole = null;

    scoreX = Number(
        localStorage.getItem("caro_score_x") || 0
    );

    scoreO = Number(
        localStorage.getItem("caro_score_o") || 0
    );

    roomInfo.style.display = "none";

    menuScreen.style.display = "none";

    gameScreen.style.display = "block";

    startNewOfflineRound();

}


/* =========================================================
   NEW OFFLINE ROUND
========================================================= */

function startNewOfflineRound() {

    board = createEmptyBoard(boardSize);

    currentPlayer = "X";

    gameOver = false;

    lastMove = null;

    renderBoard();

    updateScore();

    startTimer();

    updateStatus();

}


/* =========================================================
   TIMER
========================================================= */

function startTimer() {

    stopTimer();

    timer = 30;

    updateTimer();

    timerInterval = setInterval(() => {

        if (gameOver) {
            stopTimer();
            return;
        }

        timer--;

        updateTimer();

        if (timer <= 0) {

            stopTimer();

            handleTimeout();

        }

    }, 1000);

}


function stopTimer() {

    if (timerInterval) {

        clearInterval(timerInterval);

        timerInterval = null;

    }

}


function updateTimer() {

    timerElement.textContent = timer;

    if (timer <= 5) {

        timerElement.classList.add("warning");

    } else {

        timerElement.classList.remove("warning");

    }

}


/* =========================================================
   TIMEOUT
========================================================= */

function handleTimeout() {

    if (gameOver) return;

    const loser = currentPlayer;

    const winner = loser === "X" ? "O" : "X";

    finishGame(winner);

}


/* =========================================================
   RENDER BOARD
========================================================= */

function renderBoard() {

    boardElement.innerHTML = "";

    boardElement.style.gridTemplateColumns =
        `repeat(${boardSize}, 1fr)`;

    /*
        Kích thước bàn:

        15x15 -> 525px
        20x20 -> 600px
        25x25 -> 625px
    */

    let cellSize;

    if (boardSize === 15) {
        cellSize = 35;
    } else if (boardSize === 20) {
        cellSize = 30;
    } else {
        cellSize = 25;
    }

    boardElement.style.width =
        `${cellSize * boardSize}px`;

    boardElement.style.height =
        `${cellSize * boardSize}px`;


    for (let row = 0; row < boardSize; row++) {

        for (let col = 0; col < boardSize; col++) {

            const cell =
                document.createElement("div");

            cell.className = "cell";

            cell.style.width =
                `${cellSize}px`;

            cell.style.height =
                `${cellSize}px`;

            const value = board[row][col];

            if (value === "X") {
                cell.classList.add("x");
            }

            if (value === "O") {
                cell.classList.add("o");
            }

            if (
                lastMove &&
                lastMove.row === row &&
                lastMove.col === col
            ) {

                cell.classList.add("lastMove");

            }


            cell.addEventListener(
                "click",
                () => handleCellClick(row, col)
            );


            boardElement.appendChild(cell);

        }

    }

}


/* =========================================================
   CLICK CELL
========================================================= */

function handleCellClick(row, col) {

    if (gameOver) return;

    if (board[row][col] !== "") return;


    if (isOnlineGame) {

        if (currentPlayer !== myRole) {
            return;
        }

        makeOnlineMove(row, col);

        return;

    }


    makeOfflineMove(row, col);

}


/* =========================================================
   OFFLINE MOVE
========================================================= */

function makeOfflineMove(row, col) {

    if (board[row][col] !== "") return;

    board[row][col] = currentPlayer;

    lastMove = {
        row,
        col
    };


    if (checkWin(row, col, currentPlayer)) {

        finishGame(currentPlayer);

        return;
    }


    if (isBoardFull()) {

        finishDraw();

        return;
    }


    currentPlayer =
        currentPlayer === "X"
            ? "O"
            : "X";


    renderBoard();

    updateStatus();

    startTimer();


    /*
        Nếu đang chơi AI và đến lượt O
    */

    if (
        gameMode === "ai" &&
        currentPlayer === "O" &&
        !gameOver
    ) {

        setTimeout(makeAIMove, 300);

    }

}


/* =========================================================
   AI
========================================================= */

function makeAIMove() {

    if (gameOver) return;

    if (currentPlayer !== "O") return;


    let emptyCells = [];

    for (let r = 0; r < boardSize; r++) {

        for (let c = 0; c < boardSize; c++) {

            if (board[r][c] === "") {

                emptyCells.push({
                    row: r,
                    col: c
                });

            }

        }

    }


    if (emptyCells.length === 0) return;


    /*
        AI ưu tiên:

        1. Nước thắng ngay
        2. Chặn X thắng
        3. Ưu tiên gần trung tâm
        4. Ngẫu nhiên nhẹ
    */


    for (const move of emptyCells) {

        board[move.row][move.col] = "O";

        if (
            checkWin(
                move.row,
                move.col,
                "O"
            )
        ) {

            board[move.row][move.col] = "";

            makeOfflineMove(
                move.row,
                move.col
            );

            return;

        }

        board[move.row][move.col] = "";

    }


    for (const move of emptyCells) {

        board[move.row][move.col] = "X";

        if (
            checkWin(
                move.row,
                move.col,
                "X"
            )
        ) {

            board[move.row][move.col] = "";

            makeOfflineMove(
                move.row,
                move.col
            );

            return;

        }

        board[move.row][move.col] = "";

    }


    const center =
        (boardSize - 1) / 2;


    emptyCells.sort((a, b) => {

        const da =
            Math.abs(a.row - center) +
            Math.abs(a.col - center);

        const db =
            Math.abs(b.row - center) +
            Math.abs(b.col - center);

        return da - db;

    });


    const candidates =
        emptyCells.slice(
            0,
            Math.min(10, emptyCells.length)
        );


    const move =
        candidates[
            Math.floor(
                Math.random() *
                candidates.length
            )
        ];


    makeOfflineMove(
        move.row,
        move.col
    );

}


/* =========================================================
   CHECK WIN
========================================================= */

function checkWin(row, col, player) {

    const directions = [
        [1, 0],
        [0, 1],
        [1, 1],
        [1, -1]
    ];


    for (const [dr, dc] of directions) {

        let count = 1;


        count += countDirection(
            row,
            col,
            dr,
            dc,
            player
        );


        count += countDirection(
            row,
            col,
            -dr,
            -dc,
            player
        );


        if (count >= 5) {

            return true;

        }

    }


    return false;

}


function countDirection(
    row,
    col,
    dr,
    dc,
    player
) {

    let count = 0;

    let r = row + dr;
    let c = col + dc;


    while (
        r >= 0 &&
        r < boardSize &&
        c >= 0 &&
        c < boardSize &&
        board[r][c] === player
    ) {

        count++;

        r += dr;
        c += dc;

    }


    return count;

}


/* =========================================================
   BOARD FULL
========================================================= */

function isBoardFull() {

    for (const row of board) {

        if (row.includes("")) {

            return false;

        }

    }

    return true;

}


/* =========================================================
   FINISH GAME
========================================================= */

function finishGame(winner) {

    gameOver = true;

    stopTimer();

    if (winner === "X") {

        scoreX++;

    } else {

        scoreO++;

    }


    if (!isOnlineGame) {

        localStorage.setItem(
            "caro_score_x",
            scoreX
        );

        localStorage.setItem(
            "caro_score_o",
            scoreO
        );

    }


    updateScore();

    statusText.textContent =
        `🎉 ${winner} thắng!`;

}


/* =========================================================
   DRAW
========================================================= */

function finishDraw() {

    gameOver = true;

    stopTimer();

    statusText.textContent =
        "🤝 Hòa!";

}


/* =========================================================
   STATUS
========================================================= */

function updateStatus() {

    if (gameOver) return;

    if (isOnlineGame) {

        if (!myRole) {

            statusText.textContent =
                `Lượt ${currentPlayer}`;

            return;
        }


        if (currentPlayer === myRole) {

            statusText.textContent =
                `👉 Lượt bạn (${myRole})`;

        } else {

            statusText.textContent =
                `⏳ Lượt ${currentPlayer}`;

        }

        return;

    }


    if (gameMode === "ai") {

        if (currentPlayer === "X") {

            statusText.textContent =
                "👉 Lượt bạn";

        } else {

            statusText.textContent =
                "🤖 Máy đang suy nghĩ...";

        }

    } else {

        statusText.textContent =
            `Lượt ${currentPlayer}`;

    }

}


/* =========================================================
   SCORE
========================================================= */

function updateScore() {

    scoreXElement.textContent = scoreX;

    scoreOElement.textContent = scoreO;

}


/* =========================================================
   GENERATE ROOM CODE
========================================================= */

function generateRoomCode() {

    const chars =
        "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

    let result = "";

    for (let i = 0; i < 6; i++) {

        result +=
            chars[
                Math.floor(
                    Math.random() *
                    chars.length
                )
            ];

    }

    return result;

}


/* =========================================================
   CREATE PRESENCE
========================================================= */

/*
    Tạo một connection riêng cho thiết bị.

    Ví dụ:

    rooms/ABC123/connections/-Oxxxxxxx

    Khi trình duyệt mất kết nối,
    Firebase tự động xóa node này.
*/

async function createPresence(code, role) {

    if (!currentUser) {
        throw new Error("Chưa có Firebase user");
    }


    const connectionsRef =
        ref(
            db,
            `rooms/${code}/connections`
        );


    const connectionRef =
        push(connectionsRef);


    /*
        QUAN TRỌNG:

        Phải đăng ký onDisconnect
        TRƯỚC khi set presence.
    */

    await onDisconnect(
        connectionRef
    ).remove();


    await set(
        connectionRef,
        {
            uid: currentUser.uid,
            role: role,
            connectedAt: Date.now()
        }
    );


    presenceRef = connectionRef;

}


/* =========================================================
   CLEAR PRESENCE
========================================================= */

async function clearPresence() {

    if (!presenceRef) return;


    try {

        await onDisconnect(
            presenceRef
        ).cancel();

    } catch (error) {

        console.warn(
            "Không cancel được onDisconnect:",
            error
        );

    }


    try {

        await remove(
            presenceRef
        );

    } catch (error) {

        console.warn(
            "Không xóa được presence:",
            error
        );

    }


    presenceRef = null;

}


/* =========================================================
   CHECK REAL ONLINE PLAYER
========================================================= */

async function isPlayerOnline(code, uid) {

    if (!uid) return false;


    const connectionsRef =
        ref(
            db,
            `rooms/${code}/connections`
        );


    const snapshot =
        await get(connectionsRef);


    if (!snapshot.exists()) {

        return false;

    }


    const connections =
        snapshot.val();


    return Object.values(connections)
        .some(connection => {

            return (
                connection &&
                connection.uid === uid
            );

        });

}

async function createRoom() {

    try {

        await waitForAuth();


        if (!currentUser) {

            alert(
                "Chưa kết nối được Firebase."
            );

            return;

        }


        let code = null;

        let roomRef = null;

        let created = false;


        /*
            Tạo mã phòng chưa tồn tại.
        */

        for (let i = 0; i < 10; i++) {

            const testCode =
                generateRoomCode();


            const testRef =
                ref(
                    db,
                    `rooms/${testCode}`
                );


            const snapshot =
                await get(testRef);


            if (!snapshot.exists()) {

                code = testCode;

                roomRef = testRef;

                break;

            }

        }


        if (!roomRef) {

            alert(
                "Không thể tạo mã phòng. Hãy thử lại."
            );

        }

        await set(
            roomRef,
            {
                board: initialBoard,

                size: size,

                currentPlayer: "X",

                gameOver: false,

                gameStarted: false,

                winner: null,

                playerX: currentUser.uid,

                playerXOnline: true,

                playerO: null,

                playerOOnline: false,

                turnStartedAt: null,

                lastMove: null,

                scoreX: 0,

                scoreO: 0,

                createdAt: now,

                updatedAt: now

            }
        );


        /*
            Nếu người tạo phòng mất kết nối,
            xóa toàn bộ phòng.

            Presence riêng vẫn được tạo.
        */

        await onDisconnect(
            roomRef
        ).remove();


        await createPresence(
            code,
            "X"
        );


        isOnlineGame = true;

        roomCode = code;

        myRole = "X";

        boardSize = size;

        scoreX = 0;

        scoreO = 0;

        board = initialBoard;

        currentPlayer = "X";

        gameOver = false;

        lastMove = null;


        showGameScreen();

        setupRoomListener(code);

        updateRoomUI();


        alert(
            `Đã tạo phòng!\n\nMã phòng: ${code}\n\nGửi mã này cho người chơi O.`
        );


    } catch (error) {

        console.error(
            "CREATE ROOM ERROR:",
            error
        );

        alert(
            "Không thể tạo phòng.\n\n" +
            error.message
        );

    }

}


/* =========================================================
   JOIN ONLINE ROOM
========================================================= */

async function joinRoom() {

    try {

        await waitForAuth();


        if (!currentUser) {

            alert(
                "Chưa kết nối được Firebase."
            );

            return;

        }


        const code =
            roomInput.value
                .trim()
                .toUpperCase();


        if (code.length !== 6) {

            alert(
                "Mã phòng phải gồm 6 ký tự."
            );

            return;

        }


        const roomRef =
            ref(
                db,
                `rooms/${code}`
            );


        /*
            Đọc phòng trước.
        */

        let snapshot =
            await get(roomRef);


        if (!snapshot.exists()) {

            alert(
                "Phòng không tồn tại."
            );

            return;

        }


        let oldRoom =
            snapshot.val();


        /*
            Không cho chủ phòng tự vào phòng
            bằng cùng tài khoản.
        */

        if (
            oldRoom.playerX ===
            currentUser.uid
        ) {

            alert(
                "Bạn đang là người tạo phòng này."
            );

            return;

        }


        /*
            KIỂM TRA PLAYER O THỰC SỰ CÓ ONLINE KHÔNG.

            playerOOnline cũ có thể bị kẹt true.

            Vì vậy KHÔNG tin hoàn toàn vào
            playerOOnline nữa.
        */

        let stalePlayerUID = null;


        if (oldRoom.playerO) {

            const realOnline =
                await isPlayerOnline(
                    code,
                    oldRoom.playerO
                );


            if (realOnline) {

                alert(
                    "Phòng đã có người chơi O đang online."
                );

                return;

            }


            /*
                playerO có UID nhưng không có
                connection thật -> dữ liệu cũ.
            */

            stalePlayerUID =
                oldRoom.playerO;

        }


        /*
            Tạo presence cho người muốn vào.

            Nếu transaction thất bại,
            presence này sẽ được xóa.
        */

        await createPresence(
            code,
            "O"
        );


        /*
            Transaction đảm bảo 2 người cùng
            bấm "Vào phòng" gần như đồng thời
            thì chỉ một người lấy được O.
        */

        const transactionResult =
            await runTransaction(
                roomRef,
                currentRoom => {

                    if (!currentRoom) {

                        return;

                    }


                    /*
                        Phòng bị xóa / người X thay đổi
                    */

                    if (
                        currentRoom.playerX ===
                        currentUser.uid
                    ) {

                        return;

                    }


                    /*
                        Nếu O hiện tại là UID cũ
                        mà chúng ta vừa xác nhận
                        không còn online -> reclaim.
                    */

                    if (
                        currentRoom.playerO &&
                        currentRoom.playerO !==
                        currentUser.uid
                    ) {

                        if (
                            stalePlayerUID &&
                            currentRoom.playerO ===
                            stalePlayerUID
                        ) {

                            currentRoom.playerO =
                                currentUser.uid;

                        } else {

                            return;

                        }

                    } else {

                        currentRoom.playerO =
                            currentUser.uid;

                    }


                    currentRoom.playerOOnline =
                        true;


                    /*
                        Có O -> bắt đầu game.
                    */

                    currentRoom.gameStarted =
                        true;

                    currentRoom.currentPlayer =
                        "X";

                    currentRoom.gameOver =
                        false;

                    currentRoom.winner =
                        null;

                    currentRoom.turnStartedAt =
                        Date.now();

                    currentRoom.lastMove =
                        null;

                    currentRoom.updatedAt =
                        Date.now();


                    return currentRoom;

                }
            );


        if (!transactionResult.committed) {

            await clearPresence();


            alert(
                "Không thể vào phòng.\n" +
                "Có thể người khác vừa vào trước bạn."
            );

            return;

        }


        /*
            Lấy dữ liệu mới nhất.
        */

        const finalSnapshot =
            await get(roomRef);


        if (!finalSnapshot.exists()) {

            await clearPresence();

            alert(
                "Phòng không còn tồn tại."
            );

            return;

        }


        const finalRoom =
            finalSnapshot.val();


        /*
            Xác nhận mình thực sự là O.
        */

        if (
            finalRoom.playerO !==
            currentUser.uid
        ) {

            await clearPresence();

            alert(
                "Không thể xác nhận vị trí người chơi O."
            );

            return;

        }


        /*
            Thiết lập state.
        */

        isOnlineGame = true;

        roomCode = code;

        myRole = "O";

        boardSize =
            Number(finalRoom.size);

        board =
            finalRoom.board ||
            createEmptyBoard(boardSize);

        currentPlayer =
            finalRoom.currentPlayer || "X";

        gameOver =
            !!finalRoom.gameOver;

        lastMove =
            finalRoom.lastMove || null;

        scoreX =
            Number(finalRoom.scoreX || 0);

        scoreO =
            Number(finalRoom.scoreO || 0);


        showGameScreen();

        setupRoomListener(code);

        updateRoomUI();


    } catch (error) {

        console.error(
            "JOIN ROOM ERROR:",
            error
        );


        /*
            Nếu lỗi giữa chừng,
            cố gắng dọn presence.
        */

        await clearPresence();


        alert(
            "Không thể vào phòng.\n\n" +
            error.message
        );

    }

}


/* =========================================================
   ROOM LISTENER
========================================================= */

function setupRoomListener(code) {

    if (roomUnsubscribe) {

        roomUnsubscribe();

        roomUnsubscribe = null;

    }


    const roomRef =
        ref(
            db,
            `rooms/${code}`
        );


    roomUnsubscribe =
        onValue(
            roomRef,
            snapshot => {

                if (!snapshot.exists()) {

                    /*
                        Phòng đã bị X xóa.
                    */

                    stopTimer();

                    alert(
                        "Phòng đã đóng."
                    );

                    resetOnlineState();

                    showMenuScreen();

                    return;

                }


                const data =
                    snapshot.val();


                /*
                    Kiểm tra mình còn ở trong phòng không.
                */

                if (
                    myRole === "X" &&
                    data.playerX !==
                    currentUser?.uid
                ) {

                    resetOnlineState();

                    showMenuScreen();

                    alert(
                        "Bạn đã rời phòng."
                    );

                    return;

                }


                if (
                    myRole === "O" &&
                    data.playerO !==
                    currentUser?.uid
                ) {

                    resetOnlineState();

                    showMenuScreen();

                    alert(
                        "Bạn đã rời phòng."
                    );

                    return;

                }


                boardSize =
                    Number(data.size || 15);


                board =
                    data.board ||
                    createEmptyBoard(boardSize);


                currentPlayer =
                    data.currentPlayer || "X";


                gameOver =
                    !!data.gameOver;


                lastMove =
                    data.lastMove || null;


                scoreX =
                    Number(data.scoreX || 0);


                scoreO =
                    Number(data.scoreO || 0);


                renderBoard();

                updateScore();

                updateStatus();


                /*
                    Timer online:

                    Firebase lưu thời điểm bắt đầu
                    lượt chơi.

                    Như vậy 2 thiết bị đều tính
                    cùng một thời gian.
                */

                if (
                    data.gameStarted &&
                    !data.gameOver &&
                    data.turnStartedAt
                ) {

                    startOnlineTimer(
                        data.turnStartedAt
                    );

                } else {

                    stopTimer();

                    if (data.gameOver) {

                        timerElement.textContent =
                            "—";

                    } else {

                        timerElement.textContent =
                            "30";

                    }

                }


                /*
                    Nếu game đã kết thúc.
                */

                if (data.gameOver) {

                    stopTimer();

                    if (data.winner) {

                        statusText.textContent =
                            `🎉 ${data.winner} thắng!`;

                    } else {

                        statusText.textContent =
                            "🤝 Hòa!";

                    }

                }


                /*
                    Nếu phòng mới tạo nhưng chưa có O.
                */

                if (
                    !data.playerO &&
                    myRole === "X"
                ) {

                    stopTimer();

                    statusText.textContent =
                        "⏳ Đang chờ người chơi O...";

                    timerElement.textContent =
                        "—";

                }

            }
        );

}


/* =========================================================
   ONLINE TIMER
========================================================= */

function startOnlineTimer(turnStartedAt) {

    stopTimer();


    function update() {

        if (gameOver) {

            stopTimer();

            return;

        }


        const elapsed =
            Math.floor(
                (Date.now() - turnStartedAt) / 1000
            );


        const remaining =
            Math.max(
                0,
                30 - elapsed
            );


        timer = remaining;

        updateTimer();


        if (remaining <= 0) {

            stopTimer();

            handleOnlineTimeout();

        }

    }


    update();


    timerInterval =
        setInterval(
            update,
            250
        );

}


/* =========================================================
   ONLINE TIMEOUT
========================================================= */

async function handleOnlineTimeout() {

    if (!isOnlineGame) return;

    if (gameOver) return;


    /*
        Chỉ người đang có lượt xử lý timeout.
    */

    if (currentPlayer !== myRole) {

        return;

    }


    const roomRef =
        ref(
            db,
            `rooms/${roomCode}`
        );


    try {

        await runTransaction(
            roomRef,
            room => {

                if (!room) return;

                if (room.gameOver) return;

                if (
                    room.currentPlayer !==
                    myRole
                ) {

                    return;

                }


                const started =
                    Number(
                        room.turnStartedAt || 0
                    );


                const elapsed =
                    Date.now() - started;


                if (elapsed < 30000) {

                    return;

                }


                const winner =
                    myRole === "X"
                        ? "O"
                        : "X";


                room.gameOver = true;

                room.winner = winner;

                room.turnStartedAt = null;

                room.updatedAt =
                    Date.now();


                if (winner === "X") {

                    room.scoreX =
                        Number(room.scoreX || 0) + 1;

                } else {

                    room.scoreO =
                        Number(room.scoreO || 0) + 1;

                }


                return room;

            }
        );

    } catch (error) {

        console.error(
            "ONLINE TIMEOUT ERROR:",
            error
        );

    }

}


/* =========================================================
   ONLINE MOVE
========================================================= */

async function makeOnlineMove(row, col) {

    if (!isOnlineGame) return;

    if (gameOver) return;

    if (currentPlayer !== myRole) return;


    const roomRef =
        ref(
            db,
            `rooms/${roomCode}`
        );


    try {

        const result =
            await runTransaction(
                roomRef,
                room => {

                    if (!room) return;

                    if (room.gameOver) return;


                    if (
                        room.currentPlayer !==
                        myRole
                    ) {

                        return;

                    }


                    if (
                        !room.board ||
                        !room.board[row] ||
                        room.board[row][col] !== ""
                    ) {

                        return;

                    }


                    /*
                        Copy board
                    */

                    const newBoard =
                        room.board.map(
                            r => [...r]
                        );


                    newBoard[row][col] =
                        myRole;


                    const size =
                        Number(room.size);


                    /*
                        Kiểm tra thắng
                    */

                    const won =
                        checkWinOnBoard(
                            newBoard,
                            size,
                            row,
                            col,
                            myRole
                        );


                    /*
                        Kiểm tra hòa
                    */

                    let full = true;


                    for (const r of newBoard) {

                        if (r.includes("")) {

                            full = false;

                            break;

                        }

                    }


                    room.board =
                        newBoard;


                    room.lastMove = {
                        row,
                        col
                    };


                    if (won) {

                        room.gameOver =
                            true;

                        room.winner =
                            myRole;

                        room.turnStartedAt =
                            null;


                        if (myRole === "X") {

                            room.scoreX =
                                Number(room.scoreX || 0) + 1;

                        } else {

                            room.scoreO =
                                Number(room.scoreO || 0) + 1;

                        }

                    } else if (full) {

                        room.gameOver =
                            true;

                        room.winner =
                            null;

                        room.turnStartedAt =
                            null;

                    } else {

                        room.currentPlayer =
                            myRole === "X"
                                ? "O"
                                : "X";

                        room.turnStartedAt =
                            Date.now();

                    }


                    room.updatedAt =
                        Date.now();


                    return room;

                }
            );


        if (!result.committed) {

            return;

        }


    } catch (error) {

        console.error(
            "ONLINE MOVE ERROR:",
            error
        );

    }

}


/* =========================================================
   CHECK WIN ON ONLINE BOARD
========================================================= */

function checkWinOnBoard(
    gameBoard,
    size,
    row,
    col,
    player
) {

    const directions = [
        [1, 0],
        [0, 1],
        [1, 1],
        [1, -1]
    ];


    for (const [dr, dc] of directions) {

        let count = 1;


        count += countBoardDirection(
            gameBoard,
            size,
            row,
            col,
            dr,
            dc,
            player
        );


        count += countBoardDirection(
            gameBoard,
            size,
            row,
            col,
            -dr,
            -dc,
            player
        );


        if (count >= 5) {

            return true;

        }

    }


    return false;

}


function countBoardDirection(
    gameBoard,
    size,
    row,
    col,
    dr,
    dc,
    player
) {

    let count = 0;

    let r = row + dr;

    let c = col + dc;


    while (
        r >= 0 &&
        r < size &&
        c >= 0 &&
        c < size &&
        gameBoard[r][c] === player
    ) {

        count++;

        r += dr;

        c += dc;

    }


    return count;

}

/* =========================================================
   LEAVE ROOM
========================================================= */

async function leaveRoom() {

    if (!isOnlineGame || !roomCode) {

        showMenuScreen();

        return;

    }


    const code =
        roomCode;


    const role =
        myRole;


    const uid =
        currentUser?.uid;


    const roomRef =
        ref(
            db,
            `rooms/${code}`
        );


    try {

        /*
            Hủy onDisconnect của room nếu
            mình là X.
        */

        if (role === "X") {

            try {

                await onDisconnect(
                    roomRef
                ).cancel();

            } catch (e) {}

            /*
                X rời -> xóa phòng.
            */

            await clearPresence();

            await remove(roomRef);

        } else {

            /*
                O rời -> trả chỗ O về null.

                KHÔNG dùng room-level
                onDisconnect nữa.

                Presence node sẽ xử lý khi
                mất kết nối đột ngột.
            */

            await update(
                roomRef,
                {
                    playerO: null,

                    playerOOnline: false,

                    gameStarted: false,

                    gameOver: false,

                    winner: null,

                    currentPlayer: "X",

                    turnStartedAt: null,

                    lastMove: null,

                    updatedAt: Date.now()
                }
            );


            await clearPresence();

        }

    } catch (error) {

        console.error(
            "LEAVE ROOM ERROR:",
            error
        );


        /*
            Dù update thất bại,
            vẫn xóa presence local.
        */

        await clearPresence();

    }


    resetOnlineState();

    showMenuScreen();

}

    if (roomUnsubscribe) {

        roomUnsubscribe();

    isOnlineGame = false;

    roomCode = null;

    myRole = null;

    roomCodeDisplay.textContent =

}

                );

            }


            return;

        }


        startNewOfflineRound();

    }
);


/* =========================================================
   BACK MENU
========================================================= */

backMenuButton.addEventListener(
    "click",
    async () => {

        if (isOnlineGame) {

            await leaveRoom();

        } else {

            stopTimer();

            showMenuScreen();

        }

    }
);


/* =========================================================
   BUTTON EVENTS
========================================================= */

startButton.addEventListener(
    "click",
    startOfflineGame
);


createRoomButton.addEventListener(
    "click",
    createRoom
);


joinRoomButton.addEventListener(
    "click",
    joinRoom
);


leaveRoomButton.addEventListener(
    "click",
    async () => {

        if (
            confirm(
                "Bạn có chắc muốn rời phòng?"
            )
        ) {

            await leaveRoom();

        }

    }
);


/* =========================================================
   ROOM INPUT
========================================================= */

roomInput.addEventListener(
    "input",
    () => {

        roomInput.value =
            roomInput.value
                .toUpperCase()
                .replace(
                    /[^A-Z0-9]/g,
                    ""
                )
                .slice(0, 6);

    }
);


/* =========================================================
   AUTO JOIN FROM URL
========================================================= */

const urlParams =
    new URLSearchParams(
        window.location.search
    );


const roomFromURL =
    urlParams.get("room");


if (roomFromURL) {

    roomInput.value =
        roomFromURL
            .toUpperCase()
            .slice(0, 6);

}


/* =========================================================
   BEFORE UNLOAD
========================================================= */

window.addEventListener(
    "beforeunload",
    () => {

        /*
            Firebase onDisconnect sẽ tự xử lý
            presence khi trình duyệt mất kết nối.

            Không gọi async ở đây vì browser có thể
            đóng trang ngay lập tức.
        */

    }
);


/* =========================================================
   INITIAL STATE
========================================================= */

menuScreen.style.display =
    "block";

gameScreen.style.display =
    "none";

connectionStatus.textContent =
    "🔄 Đang kết nối Firebase...";

</script>

</body>
</html>
