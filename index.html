 <!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Caro 5 Quân Online</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#141e30,#243b55);
    color:white;
}
.container{
    width:100%;max-width:1000px;margin:auto;
    padding:25px 15px 40px;text-align:center;
}
h1{margin:0;font-size:36px}
.subtitle{margin-top:8px;color:#bbb;font-size:15px}
.online-panel{
    margin:18px auto;padding:16px;max-width:650px;
    background:rgba(255,255,255,.08);
    border-radius:16px;border:1px solid rgba(255,255,255,.12);
}
.online-title{font-size:20px;font-weight:bold;margin-bottom:12px}
.room-input{
    display:flex;justify-content:center;gap:8px;
    flex-wrap:wrap;
}
input{
    border:none;border-radius:10px;padding:11px 14px;
    font-size:16px;width:180px;text-align:center;
    text-transform:uppercase;
}
select,button{
    border:none;border-radius:10px;
    padding:11px 16px;font-size:15px;
}
select{background:white;color:#222}
button{
    background:#00c853;color:white;font-weight:bold;
    cursor:pointer;
}
button:hover{filter:brightness(1.1)}
button:active{transform:scale(.96)}
button:disabled{opacity:.5;cursor:not-allowed;transform:none}
#leaveRoomButton{background:#e53935}
#copyRoomButton{background:#1976d2}
#roomInfo{margin-top:12px;font-size:15px;color:#ddd}
#roomCodeDisplay{

}
#connectionStatus{margin-top:8px;color:#81d4fa}
.menu{
    display:flex;justify-content:center;align-items:center;
    flex-wrap:wrap;gap:10px;margin:20px 0;
}
.info{
    display:flex;justify-content:center;flex-wrap:wrap;
    gap:12px;margin-bottom:12px;
}
.card{
    min-width:110px;padding:9px 15px;border-radius:12px;
    background:rgba(255,255,255,.1);
}
.card strong{display:block;margin-top:3px;font-size:20px}
.x-score{color:#ff5252}
.o-score{color:#42a5f5}
#timer{color:#ffd740}
#status{
    margin:12px 0 15px;
    font-size:22px;font-weight:bold;
}
.board-scroll{
    width:100%;overflow-x:auto;overflow-y:hidden;
    -webkit-overflow-scrolling:touch;
    border:4px solid #111;border-radius:12px;
    background:#c99452;
    box-shadow:0 10px 30px rgba(0,0,0,.45);
    display:flex;justify-content:center;text-align:left;
}
#board{
    --cell-size:34px;
    display:grid;width:max-content;height:max-content;
    background:#e5b878;flex-shrink:0;
}
.cell{
    width:var(--cell-size);height:var(--cell-size);
    display:flex;justify-content:center;align-items:center;
    background:#e5b878;
    border-right:1px solid rgba(0,0,0,.28);
    border-bottom:1px solid rgba(0,0,0,.28);
    font-size:calc(var(--cell-size) * .72);
    font-weight:bold;line-height:1;
    cursor:pointer;user-select:none;
    -webkit-user-select:none;
    transition:background .1s,transform .1s;
}
.cell:hover{background:#f2ca8a}
.cell:active{transform:scale(.9)}
.cell.x{color:#d50000;animation:appear .15s ease-out}
.cell.o{color:#1565c0;animation:appear .15s ease-out}
.cell.win{
    background:#ffee58!important;
    animation:winner .5s infinite alternate;
}
@keyframes appear{
    from{transform:scale(0)}
    to{transform:scale(1)}
}
@keyframes winner{
    from{transform:scale(1)}
    to{transform:scale(1.15)}
}
.help{margin-top:14px;color:#aaa;font-size:14px}
@media(max-width:600px){
    .container{padding:18px 8px 30px}
    h1{font-size:28px}
    #status{font-size:19px}
    .card{min-width:90px;padding:8px 12px}
}
</style>

<body>
<div class="container">
<h1>🎮 CARO 5 QUÂN</h1>

">

</div>

</div>
<script type="module">
/* =====================================================
   FIREBASE
===================================================== */
import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import {
    getDatabase,
    ref,
    set,
    get,
    update,
    onValue,
    remove,
    runTransaction,
    onDisconnect,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";
const firebaseConfig = {
    apiKey:
        "AIzaSyA2uJ2-lHYjNeA40kFoS1-VsCaqhjYszdw",
    authDomain:
        "caro-3460d.firebaseapp.com",
    databaseURL:
        "https://caro-3460d-default-rtdb.asia-southeast1.firebasedatabase.app/",
    projectId:
        "caro-3460d",
    storageBucket:
        "caro-3460d.firebasestorage.app",
    messagingSenderId:
        "473059233945",
    appId:
        "1:473059233945:web:7bbf037f41a8a8d331e808",
    measurementId:
        "G-WXXMSSSN3W"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
/* =====================================================
   GAME
===================================================== */
const WIN_COUNT = 5;
const TURN_TIME = 30;
let SIZE = 20;
let board = [];
let currentPlayer = "X";
let gameOver = false;
let gameStarted = false;
let timer = TURN_TIME;
let timerInterval = null;
/* =====================================================
   ONLINE
===================================================== */
let roomCode = null;
let playerRole = null;
let onlineGame = false;
let roomUnsubscribe = null;
let lastProcessedGame = null;
let clientId =
    localStorage.getItem("caro_client_id");
if (!clientId) {
    clientId =
        crypto.randomUUID();
    localStorage.setItem(
        "caro_client_id",
        clientId
    );
}
/* =====================================================
   SCORE
===================================================== */
let xScore =
    Number(localStorage.getItem("caro_x_score")) || 0;
let oScore =
    Number(localStorage.getItem("caro_o_score")) || 0;
/* =====================================================
   DOM
===================================================== */
const boardElement =
    document.getElementById("board");
const statusElement =
    document.getElementById("status");
const timerElement =
    document.getElementById("timer");
const modeElement =
    document.getElementById("mode");
const sizeElement =
    document.getElementById("size");
const xScoreElement =
    document.getElementById("xScore");
const oScoreElement =
    document.getElementById("oScore");
const startButton =
    document.getElementById("startButton");
const newGameButton =
    document.getElementById("newGameButton");
const createRoomButton =
    document.getElementById("createRoomButton");
const joinRoomButton =
    document.getElementById("joinRoomButton");
const roomInput =
    document.getElementById("roomInput");
const roomInfo =
    document.getElementById("roomInfo");
const roomCodeDisplay =
    document.getElementById("roomCodeDisplay");
const connectionStatus =
    document.getElementById("connectionStatus");
const copyRoomButton =
    document.getElementById("copyRoomButton");
const leaveRoomButton =
    document.getElementById("leaveRoomButton");
/* =====================================================
   CELL SIZE
===================================================== */
function updateCellSize() {
    const wrapperWidth =
        document.querySelector(".board-scroll").clientWidth;
    const availableWidth =
        wrapperWidth - 8;
    let cellSize =
        Math.floor(availableWidth / SIZE);
    cellSize =
        Math.min(cellSize, 40);
    cellSize =
        Math.max(cellSize, 24);
    boardElement.style.setProperty(
        "--cell-size",
        cellSize + "px"
    );
}
/* =====================================================
   EMPTY BOARD
===================================================== */
function createEmptyBoard(size) {
    return Array.from(
        {length:size},
        () => Array(size).fill("")
    );
}
/* =====================================================
   CREATE BOARD
===================================================== */
function createBoard() {
    SIZE =
        Number(sizeElement.value);
    board =
        createEmptyBoard(SIZE);
    boardElement.innerHTML = "";
    boardElement.style.gridTemplateColumns =
        `repeat(${SIZE},var(--cell-size))`;
    boardElement.style.gridTemplateRows =
        `repeat(${SIZE},var(--cell-size))`;
    for(let row=0;row<SIZE;row++){
        for(let col=0;col<SIZE;col++){
            const cell =
                document.createElement("div");
            cell.className = "cell";
            cell.dataset.row = row;
            cell.dataset.col = col;
            cell.addEventListener(
                "click",
                handleClick
            );
            boardElement.appendChild(cell);
        }
    }
    updateCellSize();
}
/* =====================================================
   RENDER
===================================================== */
function renderBoard(){
    const cells =
        boardElement.querySelectorAll(".cell");
    for(let row=0;row<SIZE;row++){
        for(let col=0;col<SIZE;col++){
            const index =
                row * SIZE + col;
            const value =
                board[row][col];
            cells[index].textContent =
                value;
            cells[index].classList.remove(
                "x","o","win"
            );
            if(value==="X")
                cells[index].classList.add("x");
            if(value==="O")
                cells[index].classList.add("o");
        }
    }
}
/* =====================================================
   CLICK
===================================================== */
function handleClick(event){
    if(!gameStarted || gameOver)
        return;
    if(onlineGame){
        if(currentPlayer !== playerRole)
            return;
        makeOnlineMove(
            Number(event.currentTarget.dataset.row),
            Number(event.currentTarget.dataset.col)
        );
        return;
    }
    if(
        modeElement.value==="ai" &&
        currentPlayer==="O"
    )
        return;
    const row =
        Number(event.currentTarget.dataset.row);
    const col =
        Number(event.currentTarget.dataset.col);
    if(board[row][col] !== "")
        return;
    makeMove(row,col);
    if(
        !gameOver &&
        modeElement.value==="ai" &&
        currentPlayer==="O"
    ){
        setTimeout(aiMove,300);
    }
}
/* =====================================================
   OFFLINE MOVE
===================================================== */
function makeMove(row,col){
    board[row][col] =
        currentPlayer;
    renderBoard();
    const winningCells =
        checkWin(row,col);
    if(winningCells.length >= WIN_COUNT){
        endGame(winningCells);
        return;
    }
    if(isDraw()){
        gameOver = true;
        stopTimer();
        statusElement.textContent =
            "🤝 HÒA!";
        return;
    }
    currentPlayer =
        currentPlayer==="X"
            ? "O"
            : "X";
    statusElement.textContent =
        `Lượt của ${currentPlayer}`;
    resetTimer();
}
/* =====================================================
   ONLINE MOVE
===================================================== */
async function makeOnlineMove(row,col){
    if(!roomCode || !playerRole)
        return;
    const roomRef =
        ref(db,`rooms/${roomCode}`);
    try{
        /*
           Transaction giúp tránh trường hợp
           2 máy cùng gửi nước đi một lúc.
        */
        const result =
            await runTransaction(
                roomRef,
                room => {
                    if(!room)
                        return;
                    if(!room.playerX || !room.playerO)
                        return;
                    if(room.gameOver)
                        return;
                    if(!room.gameStarted)
                        return;
                    if(room.currentPlayer !== playerRole)
                        return;
                    const oldBoard =
                        room.board ||
                        createEmptyBoard(room.size);
                    if(
                        !oldBoard[row] ||
                        oldBoard[row][col] !== ""
                    )
                        return;
                    const newBoard =
                        oldBoard.map(
                            r => [...r]
                        );
                    newBoard[row][col] =
                        playerRole;
                    const oldCurrent =
                        playerRole;
                    const won =
                        checkWinOnBoard(
                            newBoard,
                            room.size,
                            row,
                            col
                        ).length >= WIN_COUNT;
                    const draw =
                        !won &&
                        isDrawOnBoard(
                            newBoard,
                            room.size
                        );
                    return {
                        ...room,
                        board:newBoard,
                        currentPlayer:
                            won || draw
                                ? oldCurrent
                                : (
                                    playerRole==="X"
                                        ? "O"
                                        : "X"
                                ),
                        gameOver:
                            won || draw,
                        winner:
                            won
                                ? playerRole
                                : null,
                        turnStartedAt:
                            won || draw
                                ? null
                                : Date.now(),
                        lastMove:
                            `${row},${col}`,
                        updatedAt:
                            Date.now()
                    };
                }
            );
        if(!result.committed)
            return;
    }
    catch(error){
        console.error(error);
        alert(
            "Không thể gửi nước đi.\n\n"+
            error.message
        );
    }
}
/* =====================================================
   CHECK WIN
===================================================== */
function checkWin(row,col){
    return checkWinOnBoard(
        board,
        SIZE,
        row,
        col
    );
}
function checkWinOnBoard(
    gameBoard,
    size,
    row,
    col
){
    const player =
        gameBoard[row]?.[col];
    if(!player)
        return [];
    const directions = [
        [0,1],
        [1,0],
        [1,1],
        [1,-1]
    ];
    for(const [dr,dc] of directions){
        let cells = [[row,col]];
        let r = row + dr;
        let c = col + dc;
        while(
            r>=0 &&
            r<size &&
            c>=0 &&
            c<size &&
            gameBoard[r][c]===player
        ){
            cells.push([r,c]);
            r += dr;
            c += dc;
        }
        r = row - dr;
        c = col - dc;
        while(
            r>=0 &&
            r<size &&
            c>=0 &&
            c<size &&
            gameBoard[r][c]===player
        ){
            cells.push([r,c]);
            r -= dr;
            c -= dc;
        }
        if(cells.length >= WIN_COUNT)
            return cells;
    }
    return [];
}
/* =====================================================
   DRAW
===================================================== */
function isDraw(){
    return isDrawOnBoard(
        board,
        SIZE
    );
}
function isDrawOnBoard(gameBoard,size){
    for(let row=0;row<size;row++){
        for(let col=0;col<size;col++){
            if(gameBoard[row][col]==="")
                return false;
        }
    }
    return true;
}
/* =====================================================
   END OFFLINE
===================================================== */
function endGame(winningCells){
    gameOver = true;
    stopTimer();
    if(currentPlayer==="X"){
        xScore++;
        localStorage.setItem(
            "caro_x_score",
            xScore
        );
    }else{
        oScore++;
        localStorage.setItem(
            "caro_o_score",
            oScore
        );
    }
    updateScore();
    statusElement.textContent =
        `🎉 ${currentPlayer} THẮNG!`;
    highlightWin(winningCells);
}
/* =====================================================
   ONLINE RESULT
===================================================== */
function processOnlineResult(room){
    stopTimer();
    if(room.winner){
        const winner =
            room.winner;
        const gameId =
            `${room.updatedAt}-${winner}`;
        /*
           Không cộng điểm nhiều lần
           do Firebase listener chạy nhiều lần.
        */
        if(lastProcessedGame !== gameId){
            lastProcessedGame =
                gameId;
            if(winner==="X"){
                xScore++;
                localStorage.setItem(
                    "caro_x_score",
                    xScore
                );
            }else{
                oScore++;
                localStorage.setItem(
                    "caro_o_score",
                    oScore
                );
            }
            updateScore();
        }
        /*
           Tìm và tô đường thắng.
        */
        for(let row=0;row<SIZE;row++){
            for(let col=0;col<SIZE;col++){
                if(board[row][col]===winner){
                    const win =
                        checkWin(row,col);
                    if(win.length>=WIN_COUNT){
                        highlightWin(win);
                        break;
                    }
                }
            }
        }
        statusElement.textContent =
            winner===playerRole
                ? `🎉 Bạn (${winner}) THẮNG!`
                : `😢 ${winner} THẮNG!`;
    }else{
        statusElement.textContent =
            "🤝 HÒA!";
    }
}
/* =====================================================
   HIGHLIGHT
===================================================== */
function highlightWin(cells){
    const allCells =
        boardElement.querySelectorAll(".cell");
    for(const [row,col] of cells){
        const index =
            row * SIZE + col;
        allCells[index].classList.add("win");
    }
}
/* =====================================================
   SYNCHRONIZED TIMER
===================================================== */
function resetTimer(startTime = Date.now()){
    stopTimer();
    timer = TURN_TIME;
    timerElement.textContent =
        timer;
    if(!gameStarted || gameOver)
        return;
    timerInterval =
        setInterval(
            () => updateTimer(startTime),
            250
        );
    updateTimer(startTime);
}
function updateTimer(startTime){
    if(!gameStarted || gameOver){
        stopTimer();
        return;
    }
    const elapsed =
        Math.floor(
            (Date.now()-startTime)/1000
        );
    const remaining =
        Math.max(
            0,
            TURN_TIME-elapsed
        );
    timer =
        remaining;
    timerElement.textContent =
        remaining;
    if(remaining<=0){
        stopTimer();
        if(onlineGame){
            handleOnlineTimeout(
                startTime
            );
        }else{
            currentPlayer =
                currentPlayer==="X"
                    ? "O"
                    : "X";
            statusElement.textContent =
                `⏰ Hết giờ! Lượt của ${currentPlayer}`;
            resetTimer();
        }
    }
}
async function handleOnlineTimeout(startTime){
    if(!roomCode)
        return;
    const roomRef =
        ref(db,`rooms/${roomCode}`);
    try{
        await runTransaction(
            roomRef,
            room => {
                if(!room)
                    return;
                if(room.gameOver)
                    return;
                if(!room.gameStarted)
                    return;
                if(!room.turnStartedAt)
                    return;
                /*
                   Nếu timestamp trên Firebase
                   vẫn là lượt cũ thì chuyển lượt.
                */
                if(
                    room.turnStartedAt !== startTime
                )
                    return;
                if(
                    Date.now()-room.turnStartedAt
                    < TURN_TIME*1000
                )
                    return;
                const nextPlayer =
                    room.currentPlayer==="X"
                        ? "O"
                        : "X";
                return {
                    ...room,
                    currentPlayer:
                        nextPlayer,
                    turnStartedAt:
                        Date.now(),
                    updatedAt:
                        Date.now()
                };
            }
        );
    }catch(error){
        console.error(error);
    }
}
function stopTimer(){
    if(timerInterval!==null){
        clearInterval(timerInterval);
        timerInterval = null;
    }
}
/* =====================================================
   START OFFLINE
===================================================== */
function startGame(){
    if(gameStarted)
        return;
    if(onlineGame)
        return;
    gameStarted = true;
    gameOver = false;
    currentPlayer = "X";
    startButton.disabled = true;
    startButton.textContent = "▶️ Đang chơi";
    statusElement.textContent =
        "Lượt của X";
    resetTimer();
}
/* =====================================================
   NEW GAME
===================================================== */
async function newGame(){
    stopTimer();
    if(onlineGame && roomCode){
        if(playerRole!=="X"){
            statusElement.textContent =
                "Chỉ người chơi X có thể bắt đầu ván mới.";
            return;
        }
        const roomRef =
            ref(db,`rooms/${roomCode}`);
        try{
            const snapshot =
                await get(roomRef);
            if(!snapshot.exists())
                return;
            const room =
                snapshot.val();
            if(!room.playerO){
                statusElement.textContent =
                    "Đang chờ người chơi O...";
                return;
            }
            lastProcessedGame = null;
            await update(
                roomRef,
                {
                    board:
                        createEmptyBoard(
                            Number(room.size)
                        ),
                    currentPlayer:"X",
                    gameOver:false,
                    gameStarted:true,
                    winner:null,
                    turnStartedAt:
                        Date.now(),
                    lastMove:null,
                    updatedAt:
                        Date.now()
                }
            );
        }catch(error){
            console.error(error);
            alert(error.message);
        }
        return;
    }
    gameStarted = false;
    gameOver = false;
    currentPlayer = "X";
    timer = TURN_TIME;
    timerElement.textContent =
        TURN_TIME;
    startButton.disabled = false;
    startButton.textContent =
        "▶️ Bắt đầu";
    statusElement.textContent =
        'Nhấn "Bắt đầu" để chơi';
    createBoard();
}
/* =====================================================
   ROOM CODE
===================================================== */
function generateRoomCode(){
    const chars =
        "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
    let code = "";
    for(let i=0;i<6;i++){
        code +=
            chars[
                Math.floor(
                    Math.random()*chars.length
                )
            ];
    }
    return code;
}
/* =====================================================
   CREATE ROOM
===================================================== */
async function createRoom(){
    if(roomCode){
        alert(
            "Bạn đang ở trong một phòng."
        );
        return;
    }
    const size =
        Number(sizeElement.value);
    let code = generateRoomCode();
    /*
       Đảm bảo mã phòng không bị trùng.
    */
    let roomRef =
        ref(db,`rooms/${code}`);
    let snapshot =
        await get(roomRef);
    while(snapshot.exists()){
        code =
            generateRoomCode();
        roomRef =
            ref(db,`rooms/${code}`);
        snapshot =
            await get(roomRef);
    }
    try{
        await set(
            roomRef,
            {
                board:
                    createEmptyBoard(size),
                size:size,
                currentPlayer:"X",
                gameOver:false,
                gameStarted:false,
                winner:null,
                playerX:clientId,
                playerO:null,
                turnStartedAt:null,
                createdAt:Date.now(),
                updatedAt:Date.now()
            }
        );
        roomCode = code;
        playerRole = "X";
        onlineGame = true;
        localStorage.setItem(
            "caro_room",
            roomCode
        );
        setupRoomListener();
        showRoomUI();
        statusElement.textContent =
            "⏳ Đang chờ người chơi O...";
        connectionStatus.textContent =
            "🟢 Đã tạo phòng";
        /*
           Nếu chủ phòng mất kết nối,
           Firebase tự xóa phòng.
        */
        onDisconnect(roomRef).remove();
    }catch(error){
        console.error(error);
        alert(
            "Không tạo được phòng.\n\n"+
            error.message
        );
    }
}
/* =====================================================
   JOIN ROOM
===================================================== */
async function joinRoom(){
    if(roomCode){
        alert(
            "Bạn đang ở trong một phòng."
        );
        return;
    }
    const code =
        roomInput.value.trim().toUpperCase();
    if(code.length!==6){
        alert(
            "Mã phòng phải có 6 ký tự."
        );
        return;
    }
    const roomRef =
        ref(db,`rooms/${code}`);
    try{
        const snapshot =
            await get(roomRef);
        if(!snapshot.exists()){
            alert(
                "Không tìm thấy phòng."
            );
            return;
        }
        const room =
            snapshot.val();
        if(room.playerO){
            alert(
                "Phòng đã đủ 2 người."
            );
            return;
        }
        if(room.playerX===clientId){
            alert(
                "Bạn không thể tự vào phòng của mình."
            );
            return;
        }
        /*
           Transaction để 2 người không thể
           cùng lúc chiếm vị trí O.
        */
        const result =
            await runTransaction(
                roomRef,
                currentRoom => {
                    if(!currentRoom)
                        return;
                    if(currentRoom.playerO)
                        return;
                    currentRoom.playerO =
                        clientId;
                    currentRoom.gameStarted =
                        true;
                    currentRoom.currentPlayer =
                        "X";
                    currentRoom.gameOver =
                        false;
                    currentRoom.winner =
                        null;
                    currentRoom.turnStartedAt =
                        Date.now();
                    currentRoom.updatedAt =
                        Date.now();
                    return currentRoom;
                }
            );
        if(!result.committed){
            alert(
                "Phòng vừa có người khác vào."
            );
            return;
        }
        roomCode = code;
        playerRole = "O";
        onlineGame = true;
        localStorage.setItem(
            "caro_room",
            roomCode
        );
        setupRoomListener();
        showRoomUI();
        connectionStatus.textContent =
            "🟢 Đã vào phòng";
    }catch(error){
        console.error(error);
        alert(
            "Không thể vào phòng.\n\n"+
            error.message
        );
    }
}
/* =====================================================
   ROOM LISTENER
===================================================== */
function setupRoomListener(){
    if(roomUnsubscribe)
        roomUnsubscribe();
    const roomRef =
        ref(db,`rooms/${roomCode}`);
    roomUnsubscribe =
        onValue(
            roomRef,
            snapshot => {
                if(!snapshot.exists()){
                    alert(
                        "Phòng đã bị đóng."
                    );
                    resetOnlineState();
                    return;
                }
                const room =
                    snapshot.val();
                const roomSize =
                    Number(room.size);
                if(SIZE!==roomSize){
                    SIZE = roomSize;
                    sizeElement.value =
                        roomSize;
                    createBoard();
                }
                board =
                    room.board ||
                    createEmptyBoard(SIZE);
                renderBoard();
                currentPlayer =
                    room.currentPlayer || "X";
                gameOver =
                    room.gameOver || false;
                gameStarted =
                    room.gameStarted || false;
                const playersReady =
                    !!room.playerX &&
                    !!room.playerO;
                /*
                   Người O vừa vào:
                   X sẽ tự động bắt đầu.
                */
                if(
                    playersReady &&
                    !gameStarted &&
                    !gameOver
                ){
                    update(
                        roomRef,
                        {
                            gameStarted:true,
                            currentPlayer:"X",
                            turnStartedAt:
                                Date.now(),
                            updatedAt:
                                Date.now()
                        }
                    );
                    return;
                }
                if(gameOver){
                    processOnlineResult(room);
                    return;
                }
                if(!playersReady){
                    stopTimer();
                    timerElement.textContent =
                        "—";
                    statusElement.textContent =
                        "⏳ Đang chờ người chơi O...";
                    return;
                }
                if(gameStarted){
                    if(currentPlayer===playerRole){
                        statusElement.textContent =
                            `🎯 Lượt của bạn (${playerRole})`;
                    }else{
                        statusElement.textContent =
                            `⏳ Lượt của đối thủ (${currentPlayer})`;
                    }
                    /*
                       Đồng bộ timer từ Firebase.
                    */
                    if(room.turnStartedAt){
                        resetTimer(
                            Number(
                                room.turnStartedAt
                            )
                        );
                    }
                }
            },
            error => {
                console.error(error);
                connectionStatus.textContent =
                    "🔴 Lỗi kết nối Firebase";
            }
        );
}
/* =====================================================
   ROOM UI
===================================================== */
function showRoomUI(){

/* =====================================================
   COPY LINK
===================================================== */
async function copyRoomLink(){
    if(!roomCode)
        return;
    const url =
        new URL(window.location.href);
    url.searchParams.set(
        "room",
        roomCode
    );
    try{
        await navigator.clipboard.writeText(
            url.toString()
        );
        copyRoomButton.textContent =
            "✅ Đã sao chép!";
        setTimeout(
            () => {
                copyRoomButton.textContent =
                    "🔗 Sao chép link";
            },
            1500
        );
    }catch{
        prompt(
            "Copy link này:",
            url.toString()
        );
    }
}
/* =====================================================
   LEAVE ROOM
===================================================== */
async function leaveRoom(){
    if(!roomCode)
        return;
    const code =
        roomCode;
    try{
        if(playerRole==="X"){
            await remove(
                ref(db,`rooms/${code}`)
            );
        }else{
            await update(
                ref(db,`rooms/${code}`),
                {
                    playerO:null,
                    gameStarted:false,
                    gameOver:true,
                    turnStartedAt:null,
                    updatedAt:Date.now()
                }
            );
        }
    }catch(error){
        console.error(error);
    }
    resetOnlineState();
}
/* =====================================================
   RESET ONLINE
===================================================== */
function resetOnlineState(){
    stopTimer();
    if(roomUnsubscribe){
        roomUnsubscribe();
        roomUnsubscribe = null;
    }
    roomCode = null;
    playerRole = null;
    onlineGame = false;
    localStorage.removeItem(
        "caro_room"
    );
    modeElement.disabled = false;
    sizeElement.disabled = false;
    startButton.style.display =
        "inline-block";
    startButton.disabled = false;
    createRoomButton.disabled = false;
    joinRoomButton.disabled = false;
    copyRoomButton.style.display =
        "none";
    leaveRoomButton.style.display =
        "none";
    roomCodeDisplay.textContent =
        "";
    roomInfo.textContent =
        "Chưa tham gia phòng";
    connectionStatus.textContent =
        "⚪ Chế độ offline";
    newGameButton.textContent =
        "🔄 Ván mới";
    createBoard();
    statusElement.textContent =
        'Nhấn "Bắt đầu" để chơi';
    timerElement.textContent =
        TURN_TIME;
}
/* =====================================================
   AI
===================================================== */
function aiMove(){
    if(!gameStarted || gameOver)
        return;
    let move =
        findWinningMove("O");
    if(!move)
        move =
            findWinningMove("X");
    if(!move)
        move =
            findBestMove();
    if(move)
        makeMove(move.row,move.col);
}
function findWinningMove(player){
    for(let row=0;row<SIZE;row++){
        for(let col=0;col<SIZE;col++){
            if(board[row][col]!=="")
                continue;
            board[row][col] = player;
            const win =
                checkWin(row,col).length >= WIN_COUNT;
            board[row][col] = "";
            if(win)
                return {row,col};
        }
    }
    return null;
}
function findBestMove(){
    let bestMove = null;
    let bestScore = -Infinity;
    let empty = true;
    for(let row=0;row<SIZE;row++){
        for(let col=0;col<SIZE;col++){
            if(board[row][col] !== ""){
                empty = false;
                continue;
            }
        }
    }
    if(empty){
        return {
            row:Math.floor(SIZE/2),
            col:Math.floor(SIZE/2)
        };
    }
    for(let row=0;row<SIZE;row++){
        for(let col=0;col<SIZE;col++){
            if(board[row][col]!=="")
                continue;
            const score =
                evaluatePosition(row,col);
            if(score>bestScore){
                bestScore = score;
                bestMove = {
                    row,
                    col
                };
            }
        }
    }
    return bestMove;
}
function evaluatePosition(row,col){
    let score = 0;
    const center =
        (SIZE-1)/2;
    const distance =
        Math.abs(row-center)+
        Math.abs(col-center);
    score +=
        100-distance*3;
    for(let dr=-2;dr<=2;dr++){
        for(let dc=-2;dc<=2;dc++){
            if(dr===0 && dc===0)
                continue;
            const r = row+dr;
            const c = col+dc;
            if(
                r<0 ||
                r>=SIZE ||
                c<0 ||
                c>=SIZE
            )
                continue;
            if(board[r][c]==="O")
                score += 25;
            if(board[r][c]==="X")
                score += 20;
        }
    }
    return score;
}
