<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

    background: #f3f4f6;
    color: #111827;
}

body {
    min-height: 100vh;
}


/* =====================================================
   MENU
===================================================== */

#menuScreen {

    min-height: 100vh;

    display: flex;

    align-items: center;
    justify-content: center;

    padding: 20px;
}

.menu-card {

    width: min(440px, 100%);

    background: white;

    border-radius: 22px;

    padding: 28px;

    box-shadow:
        0 12px 40px rgba(0,0,0,.10);
}

.menu-title {

    text-align: center;

    font-size: 32px;

    font-weight: 800;

    margin-bottom: 6px;
}

.menu-subtitle {

    text-align: center;

    color: #6b7280;

    margin-bottom: 25px;
}

.section-title {

    font-size: 14px;

    font-weight: 700;

    color: #374151;

    margin-top: 18px;

    margin-bottom: 7px;
}

select,
input {

    width: 100%;

    height: 46px;

    border: 1px solid #d1d5db;

    border-radius: 12px;

    padding: 0 13px;

    font-size: 16px;

    background: white;

    outline: none;
}

select:focus,
input:focus {

    border-color: #6366f1;
}

button {

    border: none;

    border-radius: 12px;

    height: 46px;

    padding: 0 18px;

    font-size: 15px;

    font-weight: 700;

    cursor: pointer;

    transition:
        transform .1s,
        opacity .1s;
}

button:active {

    transform: scale(.97);
}

button:disabled {

    opacity: .5;

    cursor: not-allowed;
}

.primary-btn {

    width: 100%;

    margin-top: 20px;

    background: #4f46e5;

    color: white;
}

.secondary-btn {

    background: #e5e7eb;

    color: #111827;
}

.online-box {

    margin-top: 20px;

    padding-top: 18px;

    border-top: 1px solid #e5e7eb;
}

.online-buttons {

    display: flex;

    gap: 10px;

    margin-top: 10px;
}

.online-buttons button {

    flex: 1;
}

.status-box {

    margin-top: 15px;

    padding: 11px 13px;

    border-radius: 10px;

    background: #f3f4f6;

    font-size: 13px;

    color: #4b5563;

    text-align: center;
}

.room-input-row {

    display: flex;

    gap: 8px;

    margin-top: 10px;
}

.room-input-row input {

    flex: 1;
}

.room-input-row button {

    flex-shrink: 0;
}

#menuRoomControls {

    display: none;
}


/* =====================================================
   GAME
===================================================== */

#gameScreen {

    display: none;

    min-height: 100vh;

    padding: 15px;
}

.game-container {

    width: 100%;

    max-width: 1100px;

    margin: auto;
}

.top-bar {

    display: flex;

    align-items: center;

    gap: 10px;

    margin-bottom: 12px;
}

.top-bar button {

    height: 40px;
}

.menu-btn {

    background: #e5e7eb;
}

.new-game-btn {

    background: #4f46e5;

    color: white;
}

.game-title {

    flex: 1;

    text-align: center;

    font-size: 22px;

    font-weight: 800;
}

.game-info {

    background: white;

    border-radius: 16px;

    padding: 14px;

    margin-bottom: 12px;

    box-shadow:
        0 5px 20px rgba(0,0,0,.06);
}

.status {

    text-align: center;

    font-size: 16px;

    font-weight: 700;

    margin-bottom: 10px;
}

.info-row {

    display: flex;

    justify-content: center;

    align-items: center;

    gap: 18px;

    flex-wrap: wrap;
}

.timer {

    font-size: 22px;

    font-weight: 800;
}

.timer.warning {

    color: #dc2626;
}

.score {

    font-size: 15px;

    font-weight: 700;
}

.room-info {

    text-align: center;

    margin-top: 8px;

    font-size: 13px;

    color: #6b7280;
}

.game-room-buttons {

    display: flex;

    justify-content: center;

    gap: 8px;

    margin-top: 10px;
}

.game-room-buttons button {

    height: 38px;
}

.leave-room-btn {

    background: #fee2e2;

    color: #991b1b;
}

.copy-room-btn {

    background: #e5e7eb;
}


/* =====================================================
   BOARD
===================================================== */

.board-wrapper {

    width: 100%;

    background: white;

    border-radius: 16px;

    padding: 10px;

    box-shadow:
        0 5px 20px rgba(0,0,0,.06);
}

.board-scroll {

    width: 100%;

    overflow: auto;

    overscroll-behavior: contain;

    -webkit-overflow-scrolling: touch;
}

#board {

    --cell-size: 34px;

    display: grid;

    width: max-content;

    height: max-content;

    margin: 0 auto;

    background: #f5deb3;

    border: 2px solid #111827;
}

.cell {

    width: var(--cell-size);

    height: var(--cell-size);

    display: flex;

    align-items: center;
    justify-content: center;

    border-right:
        1px solid rgba(0,0,0,.28);

    border-bottom:
        1px solid rgba(0,0,0,.28);

    background: #f5deb3;

    font-size:
        calc(var(--cell-size) * .72);

    font-weight: 800;

    user-select: none;

    -webkit-user-select: none;

    cursor: pointer;
}

.cell.x {

    color: #dc2626;
}

.cell.o {

    color: #2563eb;
}

.cell.last-move {

    background: #fde68a;
}

.cell.win {

    background: #86efac !important;
}


/* =====================================================
   RESPONSIVE
===================================================== */

@media (max-width: 600px) {

    #gameScreen {

        padding: 8px;
    }

    .top-bar {

        gap: 6px;
    }

    .top-bar button {

        padding: 0 12px;

        font-size: 13px;
    }

    .game-title {

        font-size: 18px;
    }

    .game-info {

        padding: 11px;
    }

    .board-wrapper {

        padding: 6px;
    }

    #board {

        --cell-size: 31px;
    }
}

@media (min-width: 700px) {

    #board {

        --cell-size: 38px;
    }
}

.hidden {

    display: none !important;
}

</style>

/* =====================================================
   BOARD
===================================================== */

function createEmptyBoard(size) {

    return Array.from(
        { length: size },
        () => Array(size).fill("")
    );

}


function renderBoard() {

    boardElement.innerHTML = "";


    boardElement.style.setProperty(
        "--cell-size",
        boardSize <= 15
            ? "38px"
            : boardSize === 20
                ? "34px"
                : "30px"
    );


    boardElement.style.gridTemplateColumns =
        `repeat(${boardSize}, var(--cell-size))`;

    boardElement.style.gridTemplateRows =
        `repeat(${boardSize}, var(--cell-size))`;


    for (
        let r = 0;
        r < boardSize;
        r++
    ) {

        for (
            let c = 0;
            c < boardSize;
            c++
        ) {

            const cell =
                document.createElement("div");


            cell.className =
                "cell";


            const value =
                board[r][c];


            if (value === "X") {

                cell.textContent =
                    "X";

                cell.classList.add("x");

            }

            else if (value === "O") {

                cell.textContent =
                    "O";

                cell.classList.add("o");

            }


            if (
                lastMove &&
                lastMove.row === r &&
                lastMove.col === c
            ) {

                cell.classList.add(
                    "last-move"
                );

            }


            if (
                winningCells.some(
                    p =>
                        p.row === r &&
                        p.col === c
                )
            ) {

                cell.classList.add(
                    "win"
                );

            }


            cell.addEventListener(
                "click",
                () =>
                    handleCellClick(r, c)
            );


            boardElement.appendChild(
                cell
            );

        }

    }

}

    if (!gameStarted)

    if (gameOver)

    if (board[row][col])

/* =====================================================
   TIMER
===================================================== */

function startTimer() {

    stopTimer();


    if (
        !gameStarted ||
        gameOver
    ) {

        return;

    }


    turnStartedAt =
        Date.now();


    updateTimer();


    timerInterval =
        setInterval(
            updateTimer,
            100
        );

}


function updateTimer() {

    if (
        !gameStarted ||
        gameOver
    ) {

        return;

    }


    const elapsed =
        Math.floor(
            (
                Date.now() -
                turnStartedAt
            ) / 1000
        );


    const remaining =
        Math.max(
            0,
            TURN_TIME - elapsed
        );


    timerElement.textContent =
        `⏱ ${remaining}`;


    timerElement.classList.toggle(
        "warning",
        remaining <= 5
    );


    if (
        remaining <= 0
    ) {

        stopTimer();

        handleTimeOut();

    }

}


function stopTimer() {

    if (
        timerInterval
    ) {

        clearInterval(
            timerInterval
        );

        timerInterval =
            null;

    }

}


/* =====================================================
   TIMEOUT
===================================================== */

function handleTimeOut() {

    if (gameOver)
        return;


    if (onlineGame) {

        handleOnlineTimeout();

        return;

    }


    const loser =
        currentPlayer;


    const winnerPlayer =
        loser === "X"
            ? "O"
            : "X";


    gameOver =
        true;

    winner =
        winnerPlayer;


    if (
        winnerPlayer === "X"
    ) {

        offlineXScore++;

        localStorage.setItem(
            "caro_x_score",
            offlineXScore
        );

    }

    else {

        offlineOScore++;

        localStorage.setItem(
            "caro_o_score",
            offlineOScore
        );

    }


    updateOfflineScore();


    statusElement.textContent =
        `⏰ ${loser} hết giờ — ${winnerPlayer} thắng!`;

}


/* =====================================================
   WIN CHECK
===================================================== */

function checkWin(
    b,
    row,
    col,
    player
) {

    const directions = [

        [1, 0],

        [0, 1],

        [1, 1],

        [1, -1]

    ];

        const [dr, dc]
        of directions

            1;


        count +=
            countDirection(
                b,
                row,
                col,
                dr,
                dc,
                player
            );


        count +=
            countDirection(
                b,
                row,
                col,
                -dr,
                -dc,
                player
            );


        if (
            count >= WIN_COUNT
        ) {

            return true;

        }

    }


    return false;

}


function countDirection(
    b,
    row,
    col,
    dr,
    dc,
    player
) {

    let count =
        0;


    let r =
        row + dr;

    let c =
        col + dc;


    while (
        r >= 0 &&
        r < b.length &&
        c >= 0 &&
        c < b.length &&
        b[r][c] === player
    ) {

        count++;

        r += dr;

        c += dc;

    }


    return count;

}


function getWinningCells(
    b,
    row,
    col,
    player
) {

    const directions = [

        [1, 0],

        [0, 1],

        [1, 1],

        [1, -1]

    ];


    for (
        const [dr, dc]
        of directions
    ) {

        const cells = [
            {
                row,
                col
            }
        ];


        let r =
            row + dr;

        let c =
            col + dc;


        while (
            r >= 0 &&
            r < b.length &&
            c >= 0 &&
            c < b.length &&
            b[r][c] === player
        ) {

            cells.push({
                row: r,
                col: c
            });


            r += dr;

            c += dc;

        }


        r =
            row - dr;

        c =
            col - dc;


        while (
            r >= 0 &&
            r < b.length &&
            c >= 0 &&
            c < b.length &&
            b[r][c] === player
        ) {

            cells.push({
                row: r,
                col: c
            });


            r -= dr;

            c -= dc;

        }


        if (
            cells.length >=
            WIN_COUNT
        ) {

            return cells;

        }

    }


    return [];

}


/* =====================================================
   BOARD FULL
===================================================== */

function isBoardFull(b) {

    for (
        let r = 0;
        r < b.length;
        r++
    ) {

        for (
            let c = 0;
            c < b.length;
            c++
        ) {

            if (
                !b[r][c]
            ) {

                return false;

            }

        }

    }


    return true;

}


/* =====================================================
   AI
===================================================== */

function makeAIMove() {

    if (
        gameOver ||
        currentPlayer !== "O"
    ) {

        aiThinking =
            false;

        return;

    }


    const move =
        findBestMove();


    if (!move) {

        aiThinking =
            false;

        return;

    }


    makeOfflineMove(
        move.row,
        move.col
    );


    aiThinking =
        false;

}


function findWinningMove(
    player
) {

    for (
        let r = 0;
        r < boardSize;
        r++
    ) {

        for (
            let c = 0;
            c < boardSize;
            c++
        ) {

            if (
                !board[r][c]
            ) {

                board[r][c] =
                    player;


                const win =
                    checkWin(
                        board,
                        r,
                        c,
                        player
                    );


                board[r][c] =
                    "";


                if (win) {

                    return {
                        row: r,
                        col: c
                    };

                }

            }

        }

    }


    return null;

}


function findBestMove() {

    let move =
        findWinningMove("O");


    if (move)
        return move;


    move =
        findWinningMove("X");


    if (move)
        return move;


    let bestScore =
        -Infinity;

    let bestMove =
        null;


    const center =
        (boardSize - 1) / 2;


    for (
        let r = 0;
        r < boardSize;
        r++
    ) {

        for (
            let c = 0;
            c < boardSize;
            c++
        ) {

            if (
                board[r][c]
            )
                continue;


            let score =
                0;


            for (
                let dr = -2;
                dr <= 2;
                dr++
            ) {

                for (
                    let dc = -2;
                    dc <= 2;
                    dc++
                ) {

                    if (
                        dr === 0 &&
                        dc === 0
                    )
                        continue;


                    const nr =
                        r + dr;

                    const nc =
                        c + dc;


                    if (
                        nr >= 0 &&
                        nr < boardSize &&
                        nc >= 0 &&
                        nc < boardSize &&
                        board[nr][nc]
                    ) {

                        score +=
                            8 -
                            Math.max(
                                Math.abs(dr),
                                Math.abs(dc)
                            );

                    }

                }

            }


            score +=
                Math.max(
                    0,
                    8 -
                    Math.abs(
                        r - center
                    ) -
                    Math.abs(
                        c - center
                    )
                );


            score +=
                Math.random() * 2;


            if (
                score >
                bestScore
            ) {

                bestScore =
                    score;

                bestMove = {
                    row: r,
                    col: c
                };

            }

        }

    }


    return bestMove;

}


/* =====================================================
   ROOM CODE
===================================================== */

function generateRoomCode() {

    const chars =
        "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";


    let code =
        "";


    for (
        let i = 0;
        i < 6;
        i++
    ) {

        code +=
            chars[
                Math.floor(
                    Math.random() *
                    chars.length
                )
            ];

    }


    return code;

}


/* =====================================================
   CREATE ROOM
===================================================== */

async function createRoom() {

    if (
        roomCode
    ) {

        alert(
            "Bạn đang ở trong một phòng."
        );

        return;

    }


    try {

        await authReady;


        if (
            !firebaseAvailable ||
            !currentUser
        ) {

            alert(
                "Firebase chưa đăng nhập.\n\n" +
                "Hãy kiểm tra Anonymous Authentication."
            );

            return;

        }


        const size =
            Number(
                sizeSelect.value
            );


        let code =
            generateRoomCode();


        let roomRef =
            ref(
                db,
                `rooms/${code}`
            );


        let snapshot =
            await get(roomRef);


        while (
            snapshot.exists()
        ) {

            code =
                generateRoomCode();


            roomRef =
                ref(
                    db,
                    `rooms/${code}`
                );


            snapshot =
                await get(roomRef);

        }


        await set(
            roomRef,
            {

                board:
                    createEmptyBoard(size),

                size:
                    size,

                currentPlayer:
                    "X",

                gameOver:
                    false,

                gameStarted:
                    false,

                winner:
                    null,

                playerX:
                    currentUser.uid,

                playerXOnline:
                    true,

                playerO:
                    null,

                playerOOnline:
                    false,

                turnStartedAt:
                    null,

                lastMove:
                    null,

                scoreX:
                    0,

                scoreO:
                    0,

                createdAt:
                    Date.now(),

                updatedAt:
                    Date.now()

            }
        );


        /*
         * X là chủ phòng.
         *
         * Nếu X mất kết nối:
         * xóa cả phòng.
         */
        await onDisconnect(
            roomRef
        ).remove();


        roomCode =
            code;

        playerRole =
            "X";

        onlineGame =
            true;


        showRoomUI();

        setupRoomListener();

        showGameScreen();


        statusElement.textContent =
            "⏳ Đang chờ người chơi O...";


        connectionStatus.textContent =
            "🟢 Đã tạo phòng";


    }
    catch (error) {

        console.error(
            "CREATE ROOM:",
            error
        );


        alert(
            "Không tạo được phòng.\n\n" +
            error.message
        );

    }

}


/* =====================================================
   JOIN ROOM
===================================================== */

async function joinRoom() {

    if (
        roomCode
    ) {

        alert(
            "Bạn đang ở trong một phòng."
        );

        return;

    }


    try {

        await authReady;


        if (
            !firebaseAvailable ||
            !currentUser
        ) {

            alert(
                "Firebase chưa đăng nhập."
            );

            return;

        }


        const code =
            roomInput.value
                .trim()
                .toUpperCase();


        if (
            code.length !== 6
        ) {

            alert(
                "Mã phòng phải có 6 ký tự."
            );

            return;

        }


        const roomRef =
            ref(
                db,
                `rooms/${code}`
            );


        /*
         * Không dùng get() để quyết định
         * phòng đầy nữa.
         *
         * Transaction bên dưới mới là
         * nơi quyết định chính thức.
         */
        const result =
            await runTransaction(

                roomRef,

                currentRoom => {

                    if (
                        !currentRoom
                    ) {

                        return;

                    }


                    /*
                     * Không thể tự vào phòng
                     * của chính mình.
                     */
                    if (
                        currentRoom.playerX ===
                        currentUser.uid
                    ) {

                        return;

                    }


                    /*
                     * KIỂM TRA NGƯỜI O.
                     *
                     * playerOOnline === true
                     * → đang có O thật sự.
                     *
                     * playerOOnline === false
                     * → O cũ đã mất kết nối,
                     *   có thể lấy lại slot.
                     *
                     * playerOOnline không tồn tại
                     * → phòng cũ dùng code phiên bản
                     *   trước → cho phép lấy lại.
                     */
                    const oldOIsOnline =
                        currentRoom.playerO &&
                        currentRoom.playerOOnline === true;


                    if (
                        oldOIsOnline
                    ) {

                        return;

                    }


                    /*
                     * Người O cũ đã offline.
                     * Thu hồi slot và cấp cho UID mới.
                     */
                    currentRoom.playerO =
                        currentUser.uid;


                    currentRoom.playerOOnline =
                        true;


                    /*
                     * Bắt đầu trận.
                     */
                    currentRoom.gameStarted =
                        true;

                    currentRoom.currentPlayer =
                        "X";

                    currentRoom.gameOver =
                        false;

                    currentRoom.winner =
                        null;

                    currentRoom.turnStartedAt =
                        Date.now();

                    currentRoom.lastMove =
                        null;


                    /*
                     * Phòng cũ chưa có điểm.
                     */
                    if (
                        typeof currentRoom.scoreX !==
                        "number"
                    ) {

                        currentRoom.scoreX =
                            0;

                    }


                    if (
                        typeof currentRoom.scoreO !==
                        "number"
                    ) {

                        currentRoom.scoreO =
                            0;

                    }


                    currentRoom.updatedAt =
                        Date.now();


                    return currentRoom;

                }

            );


        if (
            !result.committed
        ) {

            /*
             * Có thể là:
             * - phòng không tồn tại
             * - X tự vào phòng
             * - O khác đang online
             */
            const check =
                await get(roomRef);


            if (
                !check.exists()
            ) {

                alert(
                    "Không tìm thấy phòng."
                );

            }

            else {

                const room =
                    check.val();


                if (
                    room.playerX ===
                    currentUser.uid
                ) {

                    alert(
                        "Bạn không thể tự vào phòng của mình."
                    );

                }

                else if (
                    room.playerO &&
                    room.playerOOnline === true
                ) {

                    alert(
                        "Phòng đang có người chơi O."
                    );

                }

                else {

                    alert(
                        "Không thể vào phòng. Hãy thử lại."
                    );

                }

            }


            return;

        }


        /*
         * ĐĂNG KÝ ON DISCONNECT
         * SAU KHI ĐÃ CHIẾM SLOT O.
         */
        await onDisconnect(
            roomRef
        ).update({

            playerO:
                null,

            playerOOnline:
                false,

            gameStarted:
                false,

            gameOver:
                false,

            winner:
                null,

            turnStartedAt:
                null,

            updatedAt:
                Date.now()

        });


        /*
         * Xác nhận O đang online.
         */
        await update(
            roomRef,
            {

                playerO:
                    currentUser.uid,

                playerOOnline:
                    true

            }
        );


        roomCode =
            code;

        playerRole =
            "O";

        onlineGame =
            true;


        showRoomUI();

        showGameScreen();

        setupRoomListener();


        connectionStatus.textContent =
            "🟢 Đã vào phòng";


    }
    catch (error) {

        console.error(
            "JOIN ROOM:",
            error
        );


        alert(
            "Không thể vào phòng.\n\n" +
            error.message
        );

    }

}

/* =====================================================
   ROOM LISTENER
===================================================== */

function setupRoomListener() {

    if (
        !roomCode
    )
        return;


    if (
        roomUnsubscribe
    ) {

        roomUnsubscribe();

        roomUnsubscribe =
            null;

    }


    const roomRef =
        ref(
            db,
            `rooms/${roomCode}`
        );


    roomUnsubscribe =
        onValue(

            roomRef,

            snapshot => {

                if (
                    !snapshot.exists()
                ) {

                    /*
                     * Chỉ báo nếu người chơi
                     * thực sự đang ở phòng.
                     */
                    if (
                        onlineGame
                    ) {

                        alert(
                            "Phòng đã đóng."
                        );

                    }


                    resetOnlineState();

                    showMenuScreen();

                    return;

                }


                const room =
                    snapshot.val();


                /*
                 * KIỂM TRA ROLE.
                 *
                 * Nếu O cũ bị người mới thay thế,
                 * máy cũ sẽ tự thoát.
                 */
                if (
                    playerRole === "O" &&
                    currentUser &&
                    room.playerO !==
                        currentUser.uid
                ) {

                    alert(
                        "Bạn đã rời khỏi phòng."
                    );


                    resetOnlineState();

                    showMenuScreen();

                    return;

                }


                if (
                    playerRole === "X" &&
                    currentUser &&
                    room.playerX !==
                        currentUser.uid
                ) {

                    alert(
                        "Bạn không còn là chủ phòng."
                    );


                    resetOnlineState();

                    showMenuScreen();

                    return;

                }


                if (
                    typeof room.size ===
                    "number"
                ) {

                    boardSize =
                        room.size;

                }


                board =
                    room.board ||
                    createEmptyBoard(
                        boardSize
                    );


                currentPlayer =
                    room.currentPlayer ||
                    "X";


                gameOver =
                    !!room.gameOver;


                gameStarted =
                    !!room.gameStarted;


                winner =
                    room.winner ||
                    null;


                turnStartedAt =
                    room.turnStartedAt ||
                    null;


                lastMove =
                    parseLastMove(
                        room.lastMove
                    );


                winningCells =
                    [];


                updateOnlineScore(
                    room
                );


                renderBoard();

                updateOnlineStatus();


                if (
                    gameStarted &&
                    !gameOver &&
                    turnStartedAt
                ) {

                    startOnlineTimer();

                }

                else {

                    stopTimer();


                    timerElement.textContent =
                        "⏱ 30";


                    timerElement.classList.remove(
                        "warning"
                    );

                }


                if (
                    gameOver &&
                    winner &&
                    room.lastMove
                ) {

                    const lm =
                        parseLastMove(
                            room.lastMove
                        );


                    if (
                        lm
                    ) {

                        winningCells =
                            getWinningCells(
                                board,
                                lm.row,
                                lm.col,
                                winner
                            );


                        renderBoard();

                    }

                }

            },

            error => {

                console.error(
                    "ROOM LISTENER:",
                    error
                );


                connectionStatus.textContent =
                    "🔴 Lỗi kết nối phòng";

            }

        );

}


/* =====================================================
   PARSE LAST MOVE
===================================================== */

function parseLastMove(value) {

    if (
        !value
    )
        return null;


    if (
        typeof value ===
        "object"
    ) {

        if (
            typeof value.row ===
                "number" &&
            typeof value.col ===
                "number"
        ) {

            return value;

        }

        return null;

    }


    if (
        typeof value ===
        "string"
    ) {

        const parts =
            value.split(",");


        if (
            parts.length === 2
        ) {

            const row =
                Number(parts[0]);

            const col =
                Number(parts[1]);


            if (
                Number.isInteger(row) &&
                Number.isInteger(col)
            ) {

                return {
                    row,
                    col
                };

            }

        }

    }


    return null;

}


/* =====================================================
   ONLINE STATUS
===================================================== */

function updateOnlineStatus() {

    if (
        !onlineGame
    )
        return;


    if (
        !gameStarted
    ) {

        if (
            playerRole === "X"
        ) {

            statusElement.textContent =
                "⏳ Đang chờ người chơi O...";

        }

        else {

            statusElement.textContent =
                "⏳ Đang chờ trận đấu...";

        }

        return;

    }


    if (
        gameOver
    ) {

        if (
            winner
        ) {

            statusElement.textContent =
                `🏆 ${winner} thắng!`;

        }

        else {

            statusElement.textContent =
                "🤝 Hòa!";

        }

        return;

    }


    if (
        currentPlayer ===
        playerRole
    ) {

        statusElement.textContent =
            `🎯 Lượt của bạn — ${playerRole}`;

    }

    else {

        statusElement.textContent =
            `⏳ Lượt của ${currentPlayer}`;

    }

}


/* =====================================================
   ONLINE SCORE
===================================================== */

function updateOnlineScore(room) {

    const scoreX =
        Number(
            room.scoreX
        ) || 0;


    const scoreO =
        Number(
            room.scoreO
        ) || 0;


    scoreElement.innerHTML =
        `❌ ${scoreX}
         &nbsp;&nbsp;
         🟦 ${scoreO}`;

}


/* =====================================================
   ONLINE TIMER
===================================================== */

function startOnlineTimer() {

    stopTimer();


    updateOnlineTimer();


    timerInterval =
        setInterval(
            updateOnlineTimer,
            100
        );

}


function updateOnlineTimer() {

    if (
        !onlineGame ||
        !gameStarted ||
        gameOver ||
        !turnStartedAt
    ) {

        return;

    }


    const elapsed =
        Math.floor(
            (
                Date.now() -
                turnStartedAt
            ) / 1000
        );


    const remaining =
        Math.max(
            0,
            TURN_TIME - elapsed
        );


    timerElement.textContent =
        `⏱ ${remaining}`;


    timerElement.classList.toggle(
        "warning",
        remaining <= 5
    );


    /*
     * Chỉ người đang tới lượt
     * xử lý timeout.
     */
    if (
        remaining <= 0 &&
        currentPlayer ===
            playerRole
    ) {

        handleOnlineTimeout();

    }

}


/* =====================================================
   ONLINE MOVE
===================================================== */

async function handleOnlineMove(
    row,
    col
) {

    if (
        !roomCode ||
        !currentUser ||
        gameOver ||
        !gameStarted
    ) {

        return;

    }


    if (
        currentPlayer !==
        playerRole
    ) {

        return;

    }


    if (
        board[row][col]
    ) {

        return;

    }


    const roomRef =
        ref(
            db,
            `rooms/${roomCode}`
        );


    try {

        await runTransaction(

            roomRef,

            room => {

                if (
                    !room
                )
                    return;


                if (
                    room.gameOver
                )
                    return;


                if (
                    !room.gameStarted
                )
                    return;


                if (
                    room.currentPlayer !==
                    playerRole
                )
                    return;


                if (
                    room.playerO !==
                    currentUser.uid &&
                    playerRole === "O"
                )
                    return;


                if (
                    !room.board ||
                    !room.board[row] ||
                    room.board[row][col]
                )
                    return;


                const newBoard =
                    room.board.map(
                        r =>
                            Array.isArray(r)
                                ? [...r]
                                : Array(
                                    room.size
                                ).fill("")
                    );


                newBoard[row][col] =
                    playerRole;


                const won =
                    checkWin(
                        newBoard,
                        row,
                        col,
                        playerRole
                    );


                const draw =
                    !won &&
                    isBoardFull(
                        newBoard
                    );


                let scoreX =
                    Number(
                        room.scoreX
                    ) || 0;


                let scoreO =
                    Number(
                        room.scoreO
                    ) || 0;


                if (
                    won
                ) {

                    if (
                        playerRole ===
                        "X"
                    ) {

                        scoreX++;

                    }

                    else {

                        scoreO++;

                    }

                }


                return {

                    ...room,

                    board:
                        newBoard,

                    currentPlayer:
                        won || draw
                            ? room.currentPlayer
                            : (
                                playerRole === "X"
                                    ? "O"
                                    : "X"
                            ),

                    gameOver:
                        won || draw,

                    winner:
                        won
                            ? playerRole
                            : null,

                    turnStartedAt:
                        won || draw
                            ? null
                            : Date.now(),

                    lastMove: {
                        row,
                        col
                    },

                    scoreX:
                        scoreX,

                    scoreO:
                        scoreO,

                    updatedAt:
                        Date.now()

                };

            }

        );

    }
    catch (error) {

        console.error(
            "ONLINE MOVE:",
            error
        );

    }

}


/* =====================================================
   ONLINE TIMEOUT
===================================================== */

async function handleOnlineTimeout() {

    if (
        !roomCode ||
        !currentUser
    )
        return;


    const roomRef =
        ref(
            db,
            `rooms/${roomCode}`
        );


    try {

        await runTransaction(

            roomRef,

            room => {

                if (
                    !room
                )
                    return;


                if (
                    room.gameOver
                )
                    return;


                if (
                    !room.gameStarted
                )
                    return;


                if (
                    room.currentPlayer !==
                    playerRole
                )
                    return;


                const winnerPlayer =
                    playerRole === "X"
                        ? "O"
                        : "X";


                let scoreX =
                    Number(
                        room.scoreX
                    ) || 0;


                let scoreO =
                    Number(
                        room.scoreO
                    ) || 0;


                if (
                    winnerPlayer ===
                    "X"
                ) {

                    scoreX++;

                }

                else {

                    scoreO++;

                }


                return {

                    ...room,

                    gameOver:
                        true,

                    winner:
                        winnerPlayer,

                    turnStartedAt:
                        null,

                    scoreX:
                        scoreX,

                    scoreO:
                        scoreO,

                    updatedAt:
                        Date.now()

                };

            }

        );

    }
    catch (error) {

        console.error(
            "TIMEOUT:",
            error
        );

    }

}


/* =====================================================
   NEW GAME
===================================================== */

async function newGame() {

    if (
        onlineGame
    ) {

        await newOnlineGame();

        return;

    }


    startOfflineGame();

}


/* =====================================================
   NEW ONLINE GAME
===================================================== */

async function newOnlineGame() {

    if (
        !roomCode
    )
        return;


    if (
        playerRole !== "X"
    ) {

        alert(
            "Chỉ người X có thể bắt đầu ván mới."
        );

        return;

    }


    const roomRef =
        ref(
            db,
            `rooms/${roomCode}`
        );


    try {

        const snapshot =
            await get(roomRef);


        if (
            !snapshot.exists()
        )
            return;


        const room =
            snapshot.val();


        if (
            !room.playerO ||
            room.playerOOnline !== true
        ) {

            alert(
                "Chưa có người chơi O."
            );

            return;

        }


        await update(
            roomRef,
            {

                board:
                    createEmptyBoard(
                        room.size
                    ),

                currentPlayer:
                    "X",

                gameOver:
                    false,

                gameStarted:
                    true,

                winner:
                    null,

                turnStartedAt:
                    Date.now(),

                lastMove:
                    null,

                updatedAt:
                    Date.now()

            }
        );

    }
    catch (error) {

        console.error(
            "NEW ONLINE GAME:",
            error
        );

    }

}


/* =====================================================
   LEAVE ROOM
===================================================== */

async function leaveRoom() {

    if (
        !roomCode
    )
        return;


    const code =
        roomCode;


    const role =
        playerRole;


    try {

        await authReady;


        const roomRef =
            ref(
                db,
                `rooms/${code}`
            );


        /*
         * Hủy onDisconnect trước.
         */
        try {

            await onDisconnect(
                roomRef
            ).cancel();

        }
        catch (e) {

            console.warn(
                "Cancel onDisconnect:",
                e
            );

        }


        if (
            role === "X"
        ) {

            /*
             * X rời → xóa phòng.
             */
            await remove(
                roomRef
            );

        }

        else if (
            role === "O"
        ) {

            /*
             * O rời → chỉ giải phóng O.
             *
             * Điểm vẫn giữ nguyên.
             */
            await update(
                roomRef,
                {

                    playerO:
                        null,

                    playerOOnline:
                        false,

                    gameStarted:
                        false,

                    gameOver:
                        false,

                    winner:
                        null,

                    turnStartedAt:
                        null,

                    updatedAt:
                        Date.now()

                }
            );

        }

    }
    catch (error) {

        console.error(
            "LEAVE ROOM:",
            error
        );

    }


    resetOnlineState();

    showMenuScreen();

}


/* =====================================================
   RESET ONLINE
===================================================== */

function resetOnlineState() {

    if (
        roomUnsubscribe
    ) {

        roomUnsubscribe();

        roomUnsubscribe =
            null;

    }


    if (
        presenceUnsubscribe
    ) {

        presenceUnsubscribe();

        presenceUnsubscribe =
            null;

    }


    onlineGame =
        false;

    roomCode =
        null;

    playerRole =
        null;


    menuRoomControls.style.display =
        "none";


    menuRoomCode.textContent =
        "";


    roomInput.value =
        "";


    roomInfo.classList.add(
        "hidden"
    );


    gameRoomButtons.classList.add(
        "hidden"
    );


    stopTimer();

}


/* =====================================================
   COPY ROOM LINK
===================================================== */

async function copyRoomLink() {

    if (
        !roomCode
    )
        return;


    const url =
        `${location.origin}${location.pathname}?room=${roomCode}`;


    try {

        await navigator.clipboard.writeText(
            url
        );


        alert(
            "Đã copy link phòng!"
        );

    }
    catch (error) {

        prompt(
            "Copy link này:",
            url
        );

    }

}


/* =====================================================
   ROOM URL
===================================================== */

function loadRoomFromURL() {

    const params =
        new URLSearchParams(
            location.search
        );


    const code =
        params.get("room");


    if (
        code &&
        code.length === 6
    ) {

        roomInput.value =
            code.toUpperCase();

    }

}


/* =====================================================
   BUTTON EVENTS
===================================================== */

startButton.addEventListener(
    "click",
    () => {

        startOfflineGame();

    }
);


createRoomButton.addEventListener(
    "click",
    () => {

        createRoom();

    }
);


joinRoomButton.addEventListener(
    "click",
    () => {

        joinRoom();

    }
);


copyRoomButton.addEventListener(
    "click",
    () => {

        copyRoomLink();

    }
);


gameCopyRoomButton.addEventListener(
    "click",
    () => {

        copyRoomLink();

    }
);


leaveRoomButton.addEventListener(
    "click",
    () => {

        leaveRoom();

    }
);


gameLeaveRoomButton.addEventListener(
    "click",
    () => {

        leaveRoom();

    }
);


backMenuButton.addEventListener(
    "click",
    () => {

        if (
            onlineGame
        ) {

            leaveRoom();

        }

        else {

            showMenuScreen();

        }

    }
);


newGameButton.addEventListener(
    "click",
    () => {

        newGame();

    }
);


/* =====================================================
   INITIAL
===================================================== */

loadRoomFromURL();


menuScreen.style.display =
    "flex";

gameScreen.style.display =
    "none";

</script>
